<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Площадки Eventer</title><style>
@font-face{font-family:Onest;src:url('../fonts/onest-cyrillic.woff2')}*{box-sizing:border-box}body{margin:0;background:#ece9e4;color:#171717;font-family:Onest,Arial}.app{width:min(100%,520px);min-height:100dvh;margin:auto;background:#f8f7f3;padding-bottom:35px}.head{height:62px;position:sticky;top:0;z-index:5;display:grid;grid-template-columns:42px 1fr auto;align-items:center;padding:0 16px;background:#f8f7f3ee;border-bottom:1px solid #e6e1da}.head button{border:0;background:none;font-size:22px}.head img{width:96px}.head span{font-size:12px;font-weight:700}.hero{padding:25px 18px}.hero span{font-size:9px;letter-spacing:1.6px;color:#c34d22}.hero h1{font-size:37px;margin:8px 0}.hero p{font-size:12px;color:#777;margin:0}.shelf{padding:25px 0;border-top:1px solid #e6e1da}.shelf header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 16px 15px}.shelf h2{font-size:23px;line-height:1.08;margin:0 0 6px}.shelf p{font-size:11px;color:#777;margin:0}.shelf header button{border:0;background:none;color:#c34d22;font-size:10px}.row{display:flex;gap:11px;overflow:auto;padding:2px 16px 14px;scroll-snap-type:x mandatory}.card{flex:0 0 82%;min-height:210px;scroll-snap-align:start;border:0;border-radius:20px;background:#fff;padding:17px;text-align:left;box-shadow:0 8px 24px #34271c12}.card small,.card b{display:block}.card small{color:#777;font-size:10px}.card h3{font-size:20px;margin:12px 0 7px}.card p{font-size:12px;line-height:1.4}.card b{color:#c34d22;font-size:10px;margin-top:14px}.empty{margin:0 16px;padding:22px;border-radius:18px;background:#efede8;color:#777;text-align:center;font-size:11px}.choices{display:flex;gap:7px;overflow:auto;padding:0 16px 5px}.choices button{flex:none;border:1px solid #ddd5cc;border-radius:999px;background:#fff;padding:9px 12px;font:600 11px Onest;color:#333}.choices button.on{color:#fff;background:#e86830;border-color:#e86830}
</style></head><body><main class="app"><header class="head"><button onclick="history.back()">←</button><a href="../#event=wedding"><img src="../eventer-logo.svg"></a><span>Алматы</span></header><section class="hero"><span>ПЛОЩАДКИ ДЛЯ СВАДЬБЫ</span><h1>Найдите своё место</h1><p id="count">Загружаем площадки из Eventer Data Base…</p></section><div id="shelves"></div></main><script>
const API='https://hgzxowfegmvxqtryphbd.supabase.co/rest/v1/rpc/',KEY='sb_publishable_LSSMoXyNchkWJ7c2gIdGxA_GRPdZcWX',G=[30,50,100,150,200,300],B=[2000000,3000000,5000000,10000000,20000000];let guests=+(localStorage.getItem('eventerVenueGuests')||0),budget=+(localStorage.getItem('eventerVenueBudget')||0);const defs=[['Необычные места для свадьбы','Локации с нестандартной атмосферой'],['За городом и в горах','Загородные комплексы и природа'],['Всё в одном месте','Регистрация, банкет и проживание'],['Для камерной свадьбы','Пространства до 50 гостей'],['Для большой свадьбы','Площадки от 150 гостей'],['Летние площадки и террасы','Открытые площадки, веранды и террасы']];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n>=1000000?(n/1000000).toLocaleString('ru-RU')+' млн ₸':n.toLocaleString('ru-RU')+' ₸';async function rpc(n,b){let r=await fetch(API+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error();return r.json()}function card(x){return `<article class="card"><small>${esc(x.sub||'Площадка')}${x.verified?' · ✓ Проверено':''}</small><h3>${esc(x.name||'Название не указано')}</h3><p>${esc(x.address||x.desc||'Информация уточняется')}</p><b>${x.cap?'до '+x.cap+' гостей · ':''}${esc(x.price_note||'цена по запросу')}</b></article>`}function picks(values,type){return `<div class="choices">${values.map(v=>`<button data-${type}="${v}" class="${(type==='g'?guests:budget)===v?'on':''}">${type==='g'?v+' гостей':'до '+fmt(v)}</button>`).join('')}</div>`}async function load(){try{let cfg=await rpc('pub_brief_config',{p_type:'Свадьба'}),v=cfg.find(x=>x.code==='venue'),perGuest=budget&&guests?Math.round(budget/guests):null,data=await rpc('pub_brief_match',{a:{city:'Алматы',guests:guests||150,needs:[{key:v.code,roles:v.roles,like:v.like,unit:v.unit,budget_max:perGuest}]}}),result=data[0]||{},rows=result.rows||[];document.querySelector('#count').textContent=`${Number(result.matched||0).toLocaleString('ru-RU')} площадок в базе`;let first=`<section class="shelf"><header><div><h2>${guests?'Площадки для '+guests+' гостей':'Укажите количество гостей'}</h2><p>${guests?'Подходят по вместимости':'Выберите ориентировочное количество'}</p></div></header>${picks(G,'g')}${guests&&rows.length?`<div class="row">${rows.map(card).join('')}</div>`:''}</section>`;let second=`<section class="shelf"><header><div><h2>${budget?'Площадки в бюджете до '+fmt(budget):'Укажите бюджет площадки и банкета'}</h2><p>${budget?'Подходят по выбранному бюджету':'Выберите верхнюю границу бюджета'}</p></div></header>${picks(B,'b')}${budget&&rows.length?`<div class="row">${rows.map(card).join('')}</div>`:''}</section>`;document.querySelector('#shelves').innerHTML=first+second+defs.map(d=>`<section class="shelf"><header><div><h2>${d[0]}</h2><p>${d[1]}</p></div><button>Смотреть все</button></header><div class="empty">Подборка появится после разметки площадок тегами</div></section>`).join('');document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{guests=+x.dataset.g;localStorage.setItem('eventerVenueGuests',guests);load()});document.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{budget=+x.dataset.b;localStorage.setItem('eventerVenueBudget',budget);load()})}catch{document.querySelector('#count').textContent='Не удалось загрузить площадки'}}load();
</script><script src="./detail.js"></script></body></html>
