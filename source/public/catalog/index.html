<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Каталог Eventer</title><style>
@font-face{font-family:Onest;src:url('../fonts/onest-cyrillic.woff2')}*{box-sizing:border-box}body{margin:0;background:#ece9e4;color:#171717;font-family:Onest,Arial,sans-serif}.app{width:min(100%,520px);min-height:100dvh;margin:auto;padding-bottom:36px;background:#f8f7f3}.head{height:62px;position:sticky;top:0;z-index:20;padding:0 16px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;background:#f8f7f3ee;border-bottom:1px solid #e6e1da;backdrop-filter:blur(16px)}button{font:inherit}.head button{border:0;background:none;font-size:22px;text-align:left}.head a{width:96px}.head img{display:block;width:100%}.head span{font-size:12px;font-weight:700}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 14px;scrollbar-width:none}.tabs button{flex:none;border:0;border-radius:999px;padding:9px 13px;background:#ebe7e1;font-size:11px}.tabs button.on{background:#171717;color:#fff}.title{padding:20px 18px 10px}.title>span{font-size:9px;letter-spacing:1.6px;color:#c34d22}.title h1{font-size:34px;line-height:1.05;margin:8px 0}.title p{margin:0;color:#77716a;font-size:12px;line-height:1.45}.list{display:grid;gap:12px;padding:10px 14px}.card{border:0;border-radius:20px;background:#fff;padding:17px;text-align:left;box-shadow:0 8px 24px #34271c12}.top{display:flex;justify-content:space-between;gap:8px;color:#777;font-size:10px}.top b{color:#188855}.card h2{font-size:20px;margin:10px 0 7px}.card>p{margin:0;color:#666;line-height:1.45;font-size:12px}.facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.facts span,.facts strong{padding:6px 8px;border-radius:9px;background:#f1eee9;font-size:9px}.facts strong{color:#c34d22}.state{padding:42px 18px;text-align:center;color:#777}.state button,.request{border:0;border-radius:14px;background:#e86830;color:#fff;padding:12px 16px}.detail{padding:20px 16px}.detail-back{border:0;background:none;padding:0 0 18px}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#e2f3ea;color:#177344;font-size:10px}.detail h1{font-size:33px;line-height:1.05;margin:12px 0 6px}.detail>p{color:#777;margin:0 0 18px}.detail article{padding:16px;margin:10px 0;border-radius:18px;background:#fff}.detail article h2{font-size:14px;margin:0 0 7px}.detail article p{font-size:12px;line-height:1.5;margin:0;color:#555}.request{width:100%;min-height:48px;margin-top:10px}
</style></head><body><main class="app"><header class="head"><button id="back">←</button><a href="../#start"><img src="../eventer-logo.svg" alt="Eventer"></a><span>Алматы</span></header><nav class="tabs" id="tabs"></nav><div id="screen"></div></main><script>
const API='https://hgzxowfegmvxqtryphbd.supabase.co/rest/v1/rpc/',KEY='sb_publishable_LSSMoXyNchkWJ7c2gIdGxA_GRPdZcWX';
const C=[['venue','Площадки'],['organizer','Организаторы'],['host','Ведущие'],['photo','Фотографы'],['video','Видеографы'],['decor','Декор'],['dj','DJ'],['show','Артисты и шоу'],['dress','Платья'],['makeup','Красота'],['cake','Торты'],['catering','Кейтеринг'],['transport','Транспорт'],['ceremony','Регистрация'],['print','Приглашения'],['tech','Оборудование']];
const screen=document.querySelector('#screen'),tabs=document.querySelector('#tabs'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>n?Math.round(n).toLocaleString('ru-RU')+' ₸':'цена по запросу',unit=u=>u==='per_guest'?'за гостя':u==='per_hour'?'в час':u==='per_item'?'за единицу':'за работу';let code=new URLSearchParams(location.search).get('category')||'venue',config=[],rows=[],detail=null;
async function rpc(name,body){const r=await fetch(API+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(r.status);return r.json()}
function renderTabs(){tabs.innerHTML=C.map(x=>`<button data-code="${x[0]}" class="${x[0]===code?'on':''}">${x[1]}</button>`).join('');tabs.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>select(b.dataset.code))}
function state(text,retry=false){screen.innerHTML=`<div class="state"><p>${text}</p>${retry?'<button id="retry">Повторить</button>':''}</div>`;if(retry)document.querySelector('#retry').onclick=load}
async function select(next){code=next;detail=null;history.pushState({},'',`${location.pathname}?category=${code}&event=wedding`);renderTabs();await load()}
async function load(){state('Загружаем данные…');try{if(!config.length)config=await rpc('pub_brief_config',{p_type:'Свадьба'});const item=config.find(x=>x.code===code);if(!item)throw Error('category');const data=await rpc('pub_brief_match',{a:{city:'Алматы',guests:150,needs:[{key:item.code,roles:item.roles,like:item.like,unit:item.unit,budget_max:null}]}}),result=data?.[0]||{};rows=result.rows||[];renderList(item,result)}catch(e){state('Не удалось загрузить данные',true)}}
function renderList(item,result){screen.innerHTML=`<section class="title"><span>КАТАЛОГ EVENTER</span><h1>${esc(item.name)}</h1><p>${result.matched?Number(result.matched).toLocaleString('ru-RU')+' подходящих карточек в базе · показываем первые проверенные результаты':'Проверенные участники Eventer Data Base'}</p></section><section class="list">${rows.length?rows.map((x,i)=>`<button class="card" data-row="${i}"><div class="top"><span>${esc(x.sub||item.name)}</span>${x.verified?'<b>✓ Проверено</b>':''}</div><h2>${esc(x.name||'Название не указано')}</h2><p>${esc(x.desc||'Описание пока не заполнено')}</p><div class="facts">${x.address?`<span>${esc(x.address)}</span>`:''}${x.cap?`<span>до ${x.cap} гостей</span>`:''}<strong>${x.price?money(x.price)+' '+unit(x.price_unit):esc(x.price_note||'цена по запросу')}</strong></div></button>`).join(''):'<div class="state">Подходящих карточек пока нет</div>'}</section>`;screen.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>openCard(rows[+b.dataset.row]))}
async function openCard(row){state('Загружаем карточку…');try{detail=await rpc('pub_vendor_card',{p_id:row.id});renderDetail(detail)}catch(e){state('Не удалось загрузить карточку',true)}}
function renderDetail(x){const price=x.price_from||x.price;screen.innerHTML=`<section class="detail"><button class="detail-back" id="listBack">← К списку</button><div class="status">${x.verified?'✓ Проверено':'Пока не проверено'}</div><h1>${esc(x.name||'Название не указано')}</h1><p>${esc(x.category||x.subcategory||'Категория не указана')} · ${esc(x.city||'Алматы')}</p><article><h2>О карточке</h2><p>${esc(x.description||'Пока нет данных')}</p></article><article><h2>Стоимость</h2><p>${price?money(price)+' '+unit(x.price_unit):esc(x.price_note||'Пока нет данных')}</p></article><article><h2>Вместимость</h2><p>${x.capacity||x.guests_max?'до '+(x.capacity||x.guests_max)+' гостей':'Пока нет данных'}</p></article><article><h2>Подходит для</h2><p>${esc((x.event_types||[]).join(' · ')||'Пока нет данных')}</p></article><article><h2>Контакты</h2><p>${x.instagram?'Instagram: '+esc(x.instagram):'Instagram: пока нет данных'}<br>${x.website?'Сайт: '+esc(x.website):'Сайт: пока нет данных'}</p></article><button class="request">Узнать, свободна ли дата</button></section>`;document.querySelector('#listBack').onclick=()=>{detail=null;load()}}
document.querySelector('#back').onclick=()=>detail?(detail=null,load()):history.length>1?history.back():location.assign('../#event=wedding');addEventListener('popstate',()=>{code=new URLSearchParams(location.search).get('category')||'venue';detail=null;renderTabs();load()});renderTabs();load();
</script></body></html>
