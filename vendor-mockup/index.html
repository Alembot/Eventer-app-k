<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eventer — добавить карточку</title>
<style>
:root{--ink:#191919;--muted:#77736c;--line:#e6e1da;--bg:#f5f2ee;--card:#fff;--accent:#ef5b2a;--soft:#fff0e9;--ok:#217a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(100%,430px);min-height:100dvh;margin:auto;background:#fbfaf8;box-shadow:0 0 60px #0001}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 18px;background:#fbfaf8eF;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font-size:21px;font-weight:900}.logo i{color:var(--accent);font-style:normal}.back{border:0;background:none;font-size:22px;padding:0;visibility:hidden}.content{padding:22px 18px 110px}.kicker{font-size:11px;font-weight:850;letter-spacing:.12em;color:var(--accent)}h1{font-size:29px;line-height:1.08;margin:8px 0 10px}h2{font-size:18px;margin:0 0 6px}p{color:var(--muted);line-height:1.45;margin:6px 0}.search{display:flex;gap:8px;margin:22px 0}.search input,.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:white;padding:12px 13px;font:inherit}.search button,.primary{border:0;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:0 17px;min-height:48px}.secondary{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:750}.cards,.stack{display:grid;gap:12px}.card{padding:15px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 5px 16px #2b211508}.result{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:11px}.result img,.avatar{width:56px;height:56px;border-radius:15px;object-fit:cover;background:#eee}.result b{display:block}.result small{color:var(--muted)}.result button{border:0;border-radius:12px;background:var(--soft);color:#b83c15;font-weight:800;padding:10px}.hint{padding:13px;border-radius:15px;background:var(--soft);color:#7d351d;font-size:13px}.phone-mask{font-size:25px;font-weight:850;letter-spacing:.04em;margin:20px 0}.code{display:flex;gap:8px;margin:18px 0}.code input{width:100%;height:54px;text-align:center;font-size:24px;border:1px solid var(--line);border-radius:13px}.progressbox{position:sticky;top:65px;z-index:4;margin:-22px -18px 18px;padding:13px 18px;background:#fbfaf8;border-bottom:1px solid var(--line)}.progressline{height:7px;background:#e8e3dd;border-radius:999px;overflow:hidden;margin-top:9px}.progressline i{display:block;height:100%;background:var(--accent);width:60%;border-radius:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin:0 -18px 18px;padding:0 18px 5px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:750}.tabs button.on{background:var(--ink);color:white}.fields{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.required:after{content:" *";color:var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 11px}.chip.on{border-color:var(--accent);background:var(--soft);color:#a43a17}.upload{display:grid;place-items:center;min-height:125px;border:1px dashed #c8c1b8;border-radius:17px;background:#fff;color:var(--muted);text-align:center}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px}.package{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.package strong{display:block;margin-bottom:5px}.footer{position:fixed;z-index:7;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fbfaf8ee;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.footer button{flex:1}.status{display:flex;align-items:center;gap:12px}.status .dot{width:13px;height:13px;border-radius:50%;background:#f1ae37;box-shadow:0 0 0 7px #fff0d7}.status.ok .dot{background:var(--ok);box-shadow:0 0 0 7px #e5f4eb}.customer-hero{margin:-22px -18px 18px}.customer-hero img{width:100%;height:260px;object-fit:cover}.customer-body{padding:0}.badges{display:flex;flex-wrap:wrap;gap:6px}.badge{padding:6px 9px;border-radius:999px;background:#f1efeb;font-size:12px;font-weight:750}.badge.ok{background:#e7f4ec;color:var(--ok)}.why{border-left:4px solid var(--accent)}.price{font-size:22px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .primary{grid-column:1/-1}.screen-note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}@media(min-width:760px){.app{margin:28px auto;min-height:880px;border-radius:28px;overflow:hidden}.footer{bottom:28px;border-radius:0 0 28px 28px}}
</style></head><body><main class="app"><header class="top"><button class="back" id="back">‹</button><div class="logo"><i>e.</i> Eventer</div></header><section class="content" id="screen"></section><footer class="footer" id="footer"></footer></main>
<script>
const $=s=>document.querySelector(s),screen=$('#screen'),footer=$('#footer'),back=$('#back');
const photos=['../demo/wedding-references/venues/3.jpg','../demo/wedding-references/ceremony/5.jpg','../demo/wedding-references/decor/5.jpg'];
const roles=['Площадка','Агентство','Подрядчик','Артист','Специалист'],events=['Свадьба','Қыз ұзату','Құдалық','Сырға салу','Тұсау кесу','Бесік той','Шілдехана','Сүндет той','Юбилей','Корпоратив'],styles=['Традиционный асаба','Национальный ведущий','Двуязычное ведение','Современный формат'],options=['Своя аппаратура','Сценарий под ключ','Выезд в область'],rites=['Беташар','Сырға салу','Шашу'];
let S={page:'search',history:[],found:false,verified:false,tab:0,completion:60,status:0,prefill:true};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){S.history.push(S.page);S.page=page;render()}function navBack(){if(S.history.length){S.page=S.history.pop();render()}}
function foot(primary,action,secondary='',secondaryAction=null){footer.innerHTML=`${secondary?`<button class="secondary" id="second">${secondary}</button>`:''}<button class="primary" id="next">${primary}</button>`;$('#next').onclick=action;if(secondary)$('#second').onclick=secondaryAction}
function render(){back.style.visibility=S.history.length?'visible':'hidden';window.scrollTo(0,0);({search,verify,form,submitted,customer})[S.page]()}back.onclick=navBack;
function search(){screen.innerHTML=`<div class="kicker">ДОБАВИТЬ КАРТОЧКУ</div><h1>Вы уже есть в Eventer?</h1><p>В базе около 8 600 карточек. Сначала найдите свою — возможно, основные данные уже заполнены.</p><div class="search"><input id="q" placeholder="Название, телефон или Instagram"><button id="find">Найти</button></div><div id="results"></div><p class="screen-note">Телефон используется только для подтверждения и публично не показывается.</p>`;footer.innerHTML=`<button class="secondary" id="create">Создать новую карточку</button>`;$('#find').onclick=showResults;$('#q').onkeydown=e=>e.key==='Enter'&&showResults();$('#create').onclick=()=>{S.prefill=false;go('form')}}
function showResults(){S.found=true;$('#results').innerHTML=`<div class="stack"><div class="card result"><img src="${photos[0]}"><div><b>Алексей Золотой</b><small>Ведущий · Алматы<br>@alexey_zolotoy</small></div><button id="mine">Это я</button></div><div class="card result"><img src="${photos[1]}"><div><b>Golden Show</b><small>Агентство · Алматы<br>@goldenshow.kz</small></div><button>Открыть</button></div></div>`;$('#mine').onclick=()=>go('verify')}
function verify(){screen.innerHTML=`<div class="kicker">ПОДТВЕРЖДЕНИЕ</div><h1>Подтвердите, что карточка ваша</h1><div class="card"><b>Алексей Золотой</b><p>Отправим код в WhatsApp на номер из карточки.</p><div class="phone-mask">+7 701 ••• •• 48</div><div class="hint">Пока номер не подтверждён, данные карточки не изменятся.</div></div>${S.sent?`<div class="code">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" value="${i<3?'7':''}">`).join('')}</div>`:''}`;if(!S.sent)foot('Получить код в WhatsApp',()=>{S.sent=true;verify()},'Указать новый номер',()=>alert('В программной версии откроется подтверждение нового номера'));else foot('Подтвердить',()=>{S.verified=true;S.prefill=true;go('form')},'Отправить ещё раз',()=>alert('Код отправлен повторно'))}
const chip=(x,on=true)=>`<button class="chip ${on?'on':''}">${esc(x)}</button>`;
function basic(){return`<div class="fields"><div class="field"><label class="required">Роль</label><div class="chips">${roles.map((x,i)=>chip(x,S.prefill?i===4:i===0)).join('')}</div></div><div class="field"><label class="required">Категория</label><select><option>Ведущий / асаба</option><option>Организатор</option><option>Банкетный зал</option></select></div><div class="field"><label class="required">Название</label><input value="${S.prefill?'Алексей Золотой':''}" placeholder="Имя или название организации"></div><div class="field"><label class="required">Город</label><select><option>Алматы</option><option>Астана</option><option>Шымкент</option></select></div><div class="field"><label>Опыт</label><input value="${S.prefill?'12':''}" inputmode="numeric" placeholder="Лет"></div></div>`}
function contacts(){return`<div class="fields"><div class="field"><label class="required">Телефон</label><input value="${S.prefill?'+7 701 555 48 48':''}"></div><div class="field"><label>WhatsApp</label><input value="${S.prefill?'+7 701 555 48 48':''}"></div><div class="field"><label>Instagram</label><input value="${S.prefill?'@alexey_zolotoy':''}"></div><div class="field"><label>Telegram</label><input placeholder="@username"></div><div class="field"><label>Сайт</label><input placeholder="https://"></div></div>`}
function media(){return`<div class="fields"><div class="upload"><b>＋ Добавить обложку</b><span>Фото или видео</span></div><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><div class="field"><label>YouTube</label><input placeholder="Ссылка на видео"></div><div class="field"><label>Reels</label><input placeholder="Ссылка на Reels"></div></div>`}
function features(){return`<div class="fields"><div class="field"><label>Языки</label><div class="chips">${['Қазақша','Русский','English'].map((x,i)=>chip(x,i<2)).join('')}</div></div><div class="field"><label>Типы праздников</label><div class="chips">${events.map((x,i)=>chip(x,i<5)).join('')}</div></div><div class="field"><label>Стиль</label><div class="chips">${styles.map((x,i)=>chip(x,i<3)).join('')}</div></div><div class="field"><label>Опции</label><div class="chips">${options.map((x,i)=>chip(x,i!==0)).join('')}</div></div><div class="field"><label>Обряды</label><div class="chips">${rites.map(x=>chip(x)).join('')}</div></div></div>`}
function packages(){return`<div class="hint">Минимум один пакет. Эти цены используются при подборе по уровням Эконом / Средний / Премиум.</div><div class="stack" style="margin-top:14px"><div class="package"><strong>Пакет «Той»</strong><p>Ведение на двух языках, сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸ · за вечер</div></div><button class="secondary" onclick="alert('Добавлена форма нового пакета')">＋ Добавить пакет</button></div>`}
function portfolio(){return`<div class="stack"><div class="card"><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><h2 style="margin-top:12px">Свадьба Данияра и Сауле</h2><p>12 сентября 2026 · Oi-Qaragai</p></div><button class="secondary" onclick="alert('Добавлена форма мероприятия')">＋ Добавить мероприятие</button></div>`}
function description(){return`<div class="fields"><button class="secondary" onclick="this.nextElementSibling.value='Провожу современные казахские свадьбы на двух языках. Бережно работаю с традициями, готовлю персональный сценарий и координирую программу вечера.'">✦ Заполнить с ИИ</button><textarea rows="8" placeholder="Расскажите о себе"></textarea><div class="hint">ИИ использует заполненные поля и открытую информацию Instagram. Перед публикацией текст можно изменить.</div></div>`}
function form(){const tabs=['Основное','Контакты','Фото и видео','Особенности','Пакеты','Портфолио','Описание'],views=[basic,contacts,media,features,packages,portfolio,description];screen.innerHTML=`<div class="progressbox"><b>Карточка заполнена на ${S.completion}%</b><p>Добавьте пакеты, и вы начнёте попадать в подборки.</p><div class="progressline"><i style="width:${S.completion}%"></i></div></div><div class="tabs">${tabs.map((x,i)=>`<button class="${S.tab===i?'on':''}" data-tab="${i}">${x}</button>`).join('')}</div><h1>${tabs[S.tab]}</h1>${views[S.tab]()}`;screen.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;if(S.tab===4)S.completion=74;form()});foot(S.tab<tabs.length-1?'Сохранить и дальше':'Отправить на проверку',()=>{if(S.tab<tabs.length-1){S.tab++;S.completion=Math.min(92,S.completion+6);form()}else go('submitted')},'Сохранить черновик',()=>alert('Черновик сохранён в этом мокапе'))}
function submitted(){const states=[['Проверяем','Робот сверяет телефон, Instagram и сайт. Обычно это занимает несколько минут.'],['Нужно уточнить','Instagram указан верно, но на сайте не найден этот номер. Подтвердите новый номер или добавьте ссылку на профиль.'],['Проверено','Контакты, Instagram и сайт подтверждены. Карточка доступна заказчикам.']],st=states[S.status];screen.innerHTML=`<div class="kicker">КАРТОЧКА ОТПРАВЛЕНА</div><h1>Проверка данных</h1><div class="card status ${S.status===2?'ok':''}"><span class="dot"></span><div><h2>${st[0]}</h2><p>${st[1]}</p></div></div>${S.status===1?`<div class="card"><h2>Что уточнить</h2><p>Подтвердите номер +7 701 ••• •• 48 или укажите актуальный номер WhatsApp.</p><button class="secondary">Исправить номер</button></div>`:''}<div class="hint">Ручная модерация не требуется. Заявки могут приходить и при неполной карточке.</div>`;foot(S.status<2?'Обновить статус':'Посмотреть глазами заказчика',()=>{if(S.status<2){S.status++;submitted()}else go('customer')},'Вернуться к анкете',()=>go('form'))}
function customer(){screen.innerHTML=`<div class="customer-hero"><img src="${photos[0]}"></div><div class="customer-body"><div class="badges"><span class="badge ok">✓ Проверено</span><span class="badge">Қазақша</span><span class="badge">Русский</span></div><h1>Алексей Золотой</h1><p>Ведущий и асаба · Алматы</p><div class="card why"><h2>Почему подходит вам</h2><p>Проводит двуязычные свадьбы до 300 гостей, знает казахские традиции и укладывается в выбранный средний диапазон.</p></div><h2 style="margin-top:20px">Пакеты</h2><div class="package"><strong>Пакет «Той»</strong><p>Ведение, персональный сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸</div></div><h2 style="margin-top:20px">Традиции и формат</h2><div class="chips">${['Беташар','Той бастар','Құдалық','Двуязычное ведение'].map(x=>chip(x,false)).join('')}</div><h2 style="margin-top:20px">Реальные свадьбы</h2><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><div class="card" style="margin-top:18px"><h2>Что проверено</h2><p>Телефон, Instagram, сайт, примеры работ и заявленный ценовой пакет.</p></div></div>`;footer.innerHTML=`<div class="actions" style="width:100%"><button class="primary">Свободна ли дата</button><button class="secondary">В мой план</button><button class="secondary">Сравнить</button></div>`}
render();
</script></body></html>
