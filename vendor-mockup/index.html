<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eventer — добавить карточку</title>
<style>
:root{--ink:#191919;--muted:#77736c;--line:#e6e1da;--bg:#f5f2ee;--card:#fff;--accent:#ef5b2a;--soft:#fff0e9;--ok:#217a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(100%,430px);min-height:100dvh;margin:auto;background:#fbfaf8;box-shadow:0 0 60px #0001}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 18px;background:#fbfaf8eF;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font-size:21px;font-weight:900}.logo i{color:var(--accent);font-style:normal}.back{border:0;background:none;font-size:22px;padding:0;visibility:hidden}.content{padding:22px 18px 110px}.kicker{font-size:11px;font-weight:850;letter-spacing:.12em;color:var(--accent)}h1{font-size:29px;line-height:1.08;margin:8px 0 10px}h2{font-size:18px;margin:0 0 6px}p{color:var(--muted);line-height:1.45;margin:6px 0}.search{display:flex;gap:8px;margin:22px 0}.search input,.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:white;padding:12px 13px;font:inherit}.search button,.primary{border:0;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:0 17px;min-height:48px}.secondary{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:750}.cards,.stack{display:grid;gap:12px}.card{padding:15px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 5px 16px #2b211508}.result{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:11px}.result img,.avatar{width:56px;height:56px;border-radius:15px;object-fit:cover;background:#eee}.result b{display:block}.result small{color:var(--muted)}.result button{border:0;border-radius:12px;background:var(--soft);color:#b83c15;font-weight:800;padding:10px}.hint{padding:13px;border-radius:15px;background:var(--soft);color:#7d351d;font-size:13px}.phone-mask{font-size:25px;font-weight:850;letter-spacing:.04em;margin:20px 0}.code{display:flex;gap:8px;margin:18px 0}.code input{width:100%;height:54px;text-align:center;font-size:24px;border:1px solid var(--line);border-radius:13px}.progressbox{position:sticky;top:65px;z-index:4;margin:-22px -18px 18px;padding:13px 18px;background:#fbfaf8;border-bottom:1px solid var(--line)}.progressline{height:7px;background:#e8e3dd;border-radius:999px;overflow:hidden;margin-top:9px}.progressline i{display:block;height:100%;background:var(--accent);width:60%;border-radius:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin:0 -18px 18px;padding:0 18px 5px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:750}.tabs button.on{background:var(--ink);color:white}.fields{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.required:after{content:" *";color:var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 11px}.chip.on{border-color:var(--accent);background:var(--soft);color:#a43a17}.upload{display:grid;place-items:center;min-height:125px;border:1px dashed #c8c1b8;border-radius:17px;background:#fff;color:var(--muted);text-align:center}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px}.package{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.package strong{display:block;margin-bottom:5px}.footer{position:fixed;z-index:7;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fbfaf8ee;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.footer button{flex:1}.status{display:flex;align-items:center;gap:12px}.status .dot{width:13px;height:13px;border-radius:50%;background:#f1ae37;box-shadow:0 0 0 7px #fff0d7}.status.ok .dot{background:var(--ok);box-shadow:0 0 0 7px #e5f4eb}.customer-hero{margin:-22px -18px 18px}.customer-hero img{width:100%;height:260px;object-fit:cover}.customer-body{padding:0}.badges{display:flex;flex-wrap:wrap;gap:6px}.badge{padding:6px 9px;border-radius:999px;background:#f1efeb;font-size:12px;font-weight:750}.badge.ok{background:#e7f4ec;color:var(--ok)}.why{border-left:4px solid var(--accent)}.price{font-size:22px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .primary{grid-column:1/-1}.screen-note{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}@media(min-width:760px){.app{margin:28px auto;min-height:880px;border-radius:28px;overflow:hidden}.footer{bottom:28px;border-radius:0 0 28px 28px}}
.profile-button{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}.profile-head img{width:78px;height:78px;border-radius:50%;object-fit:cover}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 22px}.quick-grid button{min-height:78px;border:0;border-radius:17px;background:#fff;padding:9px 4px;font-size:11px;font-weight:750}.quick-grid b{display:block;font-size:20px;margin-bottom:6px}.menu-block{overflow:hidden;padding:0}.menu-row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.menu-row:last-child{border-bottom:0}.menu-row strong{display:block}.menu-row small{display:block;color:var(--muted);margin-top:3px}.menu-row em{margin-left:auto;color:var(--muted);font-style:normal}.cabinet-stat{display:grid;grid-template-columns:1fr auto;gap:8px}.cabinet-stat strong{font-size:24px}
</style></head><body><main class="app"><header class="top"><button class="back" id="back">‹</button><div class="logo"><i>e.</i> Eventer</div><button class="profile-button" id="profile" aria-label="Профиль">👤</button></header><section class="content" id="screen"></section><footer class="footer" id="footer"></footer></main>
<script>
const $=s=>document.querySelector(s),screen=$('#screen'),footer=$('#footer'),back=$('#back'),profileButton=$('#profile');
const photos=['../demo/wedding-references/venues/3.jpg','../demo/wedding-references/ceremony/5.jpg','../demo/wedding-references/decor/5.jpg'];
const roles=['Площадка','Агентство','Подрядчик','Артист','Специалист'],events=['Свадьба','Қыз ұзату','Құдалық','Сырға салу','Тұсау кесу','Бесік той','Шілдехана','Сүндет той','Юбилей','Корпоратив'],styles=['Традиционный асаба','Национальный ведущий','Двуязычное ведение','Современный формат'],options=['Своя аппаратура','Сценарий под ключ','Выезд в область'],rites=['Беташар','Сырға салу','Шашу'];
let S={page:'search',history:[],found:false,verified:false,tab:0,status:0,prefill:true,notice:null,formData:null,hasCard:false};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){S.history.push(S.page);if(page==='submitted')S.hasCard=true;S.page=page;render()}function navBack(){if(S.history.length){S.page=S.history.pop();render()}}
function foot(primary,action,secondary='',secondaryAction=null){footer.innerHTML=`${secondary?`<button class="secondary" id="second">${secondary}</button>`:''}<button class="primary" id="next">${primary}</button>`;$('#next').onclick=action;if(secondary)$('#second').onclick=secondaryAction}
function render(){back.style.visibility=S.history.length?'visible':'hidden';window.scrollTo(0,0);({search,verify,newPhone,notice,form,submitted,customer,profile,cabinet})[S.page]()}back.onclick=navBack;profileButton.onclick=()=>S.page!=='profile'&&go('profile');
function search(){screen.innerHTML=`<div class="kicker">ДОБАВИТЬ КАРТОЧКУ</div><h1>Вы уже есть в Eventer?</h1><p>В базе около 8 600 карточек. Сначала найдите свою — возможно, основные данные уже заполнены.</p><div class="search"><input id="q" placeholder="Название, телефон или Instagram"><button id="find">Найти</button></div><div id="results"></div><p class="screen-note">Телефон используется только для подтверждения и публично не показывается.</p>`;footer.innerHTML=`<button class="secondary" id="create">Создать новую карточку</button>`;$('#find').onclick=showResults;$('#q').onkeydown=e=>e.key==='Enter'&&showResults();$('#create').onclick=()=>{S.prefill=false;S.formData=null;go('form')}}
function showResults(){S.found=true;$('#results').innerHTML=`<div class="stack"><div class="card result"><img src="${photos[0]}"><div><b>Нұрлан Асылбек · демо</b><small>Ведущий · Алматы<br>@nurlan_demo_eventer</small></div><button id="mine">Это я</button></div><div class="card result"><img src="${photos[1]}"><div><b>Samal Event Studio · демо</b><small>Агентство · Алматы<br>@samal_event_demo</small></div><button>Открыть</button></div></div>`;$('#mine').onclick=()=>go('verify')}
function verify(){screen.innerHTML=`<div class="kicker">ПОДТВЕРЖДЕНИЕ</div><h1>Подтвердите, что карточка ваша</h1><div class="card"><b>Нұрлан Асылбек · демонстрационная карточка</b><p>Отправим код в WhatsApp на номер из карточки.</p><div class="phone-mask">+7 700 ••• •• 01</div><div class="hint">Пока номер не подтверждён, данные карточки не изменятся.</div></div>${S.sent?`<div class="code">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" value="${i<3?'7':''}">`).join('')}</div>`:''}`;if(!S.sent)foot('Получить код в WhatsApp',()=>{S.sent=true;verify()},'Указать новый номер',()=>go('newPhone'));else foot('Подтвердить',()=>{S.verified=true;S.prefill=true;S.formData=null;go('form')},'Отправить ещё раз',()=>{S.notice={title:'Код отправлен повторно',text:'Новый код отправлен в WhatsApp на +7 700 ••• •• 01.',returnTo:'verify'};go('notice')})}
function newPhone(){screen.innerHTML=`<div class="kicker">НОВЫЙ НОМЕР</div><h1>Укажите номер WhatsApp</h1><p>На него придёт код. Данные карточки изменятся только после подтверждения.</p><div class="field"><label>Номер телефона</label><input id="new-number" inputmode="tel" value="+7 "></div>`;foot('Получить код',()=>{S.notice={title:'Код отправлен',text:'Код подтверждения отправлен на новый номер WhatsApp.',returnTo:'verify'};S.sent=true;go('notice')},'Отмена',navBack)}
function notice(){const n=S.notice||{title:'Готово',text:'Действие выполнено.',returnTo:'form'};screen.innerHTML=`<div class="kicker">EVENTER</div><div class="card status ok" style="margin-top:18px"><span class="dot"></span><div><h1>${esc(n.title)}</h1><p>${esc(n.text)}</p></div></div>`;foot('Продолжить',()=>{S.page=n.returnTo;S.notice=null;render()})}
function openNotice(title,text){S.notice={title,text,returnTo:'profile'};go('notice')}
function profile(){footer.innerHTML='';screen.innerHTML=`<div class="profile-head"><img src="${photos[1]}" alt="Фото пользователя"><div><h1 style="margin-bottom:4px">Айдос Серік · демо</h1><p>+7 700 ••• •• 01</p><small class="muted">Один аккаунт для праздников и работы</small></div></div><div class="quick-grid"><button data-quick="events"><b>🎉</b>Мои праздники</button><button data-quick="fav"><b>♥</b>Избранное</button><button data-quick="help"><b>◉</b>Поддержка</button><button data-quick="settings"><b>⚙</b>Настройки</button></div><div class="card menu-block"><button class="menu-row" data-profile="plan"><span>✓</span><div><strong>Мой план</strong><small>Бюджет, команда и задачи</small></div><em>›</em></button><button class="menu-row" data-profile="requests"><span>✉</span><div><strong>Мои заявки</strong><small>Запросы площадкам и исполнителям</small></div><em>›</em></button></div><div class="card menu-block" style="margin-top:14px"><button class="menu-row" id="pro"><span>★</span><div><strong>Eventer для профи</strong><small>Площадки, агентства, артисты, специалисты — получайте заказы</small></div><em>›</em></button><button class="menu-row" id="business"><span>▣</span><div><strong>Бизнес-аккаунт</strong><small>Для компаний и команд</small></div><em>скоро</em></button><button class="menu-row" id="suggest"><span>⌖</span><div><strong>Подсказать место или исправить ошибку</strong></div><em>›</em></button></div><div class="card menu-block" style="margin-top:14px"><button class="menu-row" id="about"><span>i</span><div><strong>О сервисе</strong></div><em>›</em></button></div>`;screen.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>openNotice(b.textContent.trim(), 'Раздел показан как часть структуры профиля и будет подключён к данным пользователя.'));screen.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>openNotice(b.textContent.trim(), 'Здесь будут ваши сохранённые данные по событиям и заявкам.'));$('#pro').onclick=()=>S.hasCard?go('cabinet'):go('search');$('#business').onclick=()=>openNotice('Бизнес-аккаунт','Раздел появится позже.');$('#suggest').onclick=()=>openNotice('Подсказать место или исправить ошибку','Здесь можно будет отправить новое место или сообщить об ошибке в карточке.');$('#about').onclick=()=>openNotice('О сервисе','Eventer помогает планировать события, находить исполнителей и получать заказы в одном аккаунте.')}
function cabinet(){initForm();footer.innerHTML='';const pct=completion();screen.innerHTML=`<div class="kicker">EVENTER ДЛЯ ПРОФИ</div><h1>Кабинет профи</h1><p>Тот же аккаунт и номер телефона. Переключаться между ролями не нужно.</p><div class="card"><div class="cabinet-stat"><div><h2>Моя карточка</h2><p>Нұрлан Асылбек · демо</p></div><strong>${pct}%</strong></div><div class="progressline"><i style="width:${pct}%"></i></div><button class="secondary" id="edit-card" style="margin-top:12px">Редактировать карточку</button></div><div class="card menu-block" style="margin-top:14px"><button class="menu-row" id="inbox"><span>✉</span><div><strong>Входящие заявки</strong><small>3 новые заявки</small></div><em>3</em></button><button class="menu-row" id="calendar"><span>▦</span><div><strong>Календарь занятости</strong><small>Свободные и занятые даты</small></div><em>›</em></button><button class="menu-row" id="prices"><span>₸</span><div><strong>Пакеты и цены</strong><small>${S.formData.packages||0} пакет</small></div><em>›</em></button><button class="menu-row" id="verification"><span>✓</span><div><strong>Статус проверки</strong><small>${S.status===2?'Проверено':'Проверяем'}</small></div><em>›</em></button></div>`;$('#edit-card').onclick=()=>{S.tab=0;go('form')};$('#prices').onclick=()=>{S.tab=4;go('form')};$('#verification').onclick=()=>go('submitted');$('#inbox').onclick=()=>{S.notice={title:'Входящие заявки',text:'Три демонстрационные заявки: свадьба, Ұзату и корпоратив.',returnTo:'cabinet'};go('notice')};$('#calendar').onclick=()=>{S.notice={title:'Календарь занятости',text:'В рабочей версии здесь будут свободные и занятые даты.',returnTo:'cabinet'};go('notice')}}
const chip=(x,on=true)=>`<button class="chip ${on?'on':''}">${esc(x)}</button>`;
function initForm(){if(S.formData)return;S.formData=S.prefill?{role:'Специалист',category:'Ведущий / асаба',name:'Нұрлан Асылбек · демо',city:'Алматы',experience:'12',phone:'+7 700 000 00 01',whatsapp:'+7 700 000 00 01',instagram:'@nurlan_demo_eventer',telegram:'',site:'',media:3,languages:2,eventTypes:5,styles:3,options:2,rites:3,packages:1,portfolio:1,description:''}:{role:'Площадка',category:'Банкетный зал',name:'',city:'Алматы',experience:'',phone:'',whatsapp:'',instagram:'',telegram:'',site:'',media:0,languages:0,eventTypes:0,styles:0,options:0,rites:0,packages:0,portfolio:0,description:''}}
function completion(){initForm();const d=S.formData,checks=[d.role,d.category,d.name,d.city,d.experience,d.phone,d.whatsapp,d.instagram,d.telegram,d.site,d.media,d.languages,d.eventTypes,d.styles,d.options,d.rites,d.packages,d.portfolio,d.description];return Math.round(checks.filter(Boolean).length/checks.length*100)}
function basic(){const d=S.formData;return`<div class="fields"><div class="field"><label class="required">Роль</label><div class="chips">${roles.map(x=>chip(x,d.role===x)).join('')}</div></div><div class="field"><label class="required">Категория</label><select data-field="category"><option ${d.category==='Ведущий / асаба'?'selected':''}>Ведущий / асаба</option><option ${d.category==='Организатор'?'selected':''}>Организатор</option><option ${d.category==='Банкетный зал'?'selected':''}>Банкетный зал</option></select></div><div class="field"><label class="required">Название</label><input data-field="name" value="${esc(d.name)}" placeholder="Имя или название организации"></div><div class="field"><label class="required">Город</label><select data-field="city"><option ${d.city==='Алматы'?'selected':''}>Алматы</option><option ${d.city==='Астана'?'selected':''}>Астана</option><option ${d.city==='Шымкент'?'selected':''}>Шымкент</option></select></div><div class="field"><label>Опыт</label><input data-field="experience" value="${esc(d.experience)}" inputmode="numeric" placeholder="Лет"></div></div>`}
function contacts(){const d=S.formData;return`<div class="fields"><div class="field"><label class="required">Телефон</label><input data-field="phone" value="${esc(d.phone)}"></div><div class="field"><label>WhatsApp</label><input data-field="whatsapp" value="${esc(d.whatsapp)}"></div><div class="field"><label>Instagram</label><input data-field="instagram" value="${esc(d.instagram)}"></div><div class="field"><label>Telegram</label><input data-field="telegram" value="${esc(d.telegram)}" placeholder="@username"></div><div class="field"><label>Сайт</label><input data-field="site" value="${esc(d.site)}" placeholder="https://"></div></div>`}
function media(){const d=S.formData;return`<div class="fields"><button class="upload" id="add-media"><b>＋ Добавить обложку</b><span>Фото или видео</span></button>${d.media?`<div class="gallery">${photos.slice(0,d.media).map(x=>`<img src="${x}">`).join('')}</div>`:'<div class="hint">Фото и видео пока не добавлены.</div>'}<div class="field"><label>YouTube</label><input placeholder="Ссылка на видео"></div><div class="field"><label>Reels</label><input placeholder="Ссылка на Reels"></div></div>`}
function featureChips(list,key){return list.map((x,i)=>`<button class="chip ${i<S.formData[key]?'on':''}" data-feature="${key}" data-index="${i}">${esc(x)}</button>`).join('')}
function features(){return`<div class="fields"><div class="field"><label>Языки</label><div class="chips">${featureChips(['Қазақша','Русский','English'],'languages')}</div></div><div class="field"><label>Типы праздников</label><div class="chips">${featureChips(events,'eventTypes')}</div></div><div class="field"><label>Стиль</label><div class="chips">${featureChips(styles,'styles')}</div></div><div class="field"><label>Опции</label><div class="chips">${featureChips(options,'options')}</div></div><div class="field"><label>Обряды</label><div class="chips">${featureChips(rites,'rites')}</div></div></div>`}
function packages(){const d=S.formData;return`<div class="hint">Минимум один пакет. Эти цены используются при подборе по уровням Эконом / Средний / Премиум.</div><div class="stack" style="margin-top:14px">${d.packages?`<div class="package"><strong>Демонстрационный пакет «Той»</strong><p>Ведение на двух языках, сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸ · за вечер</div></div>`:'<div class="card"><p>Пакеты пока не добавлены.</p></div>'}<button class="secondary" id="add-package">＋ Добавить пакет</button></div>`}
function portfolio(){const d=S.formData;return`<div class="stack">${d.portfolio?`<div class="card"><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><h2 style="margin-top:12px">Демонстрационная свадьба</h2><p>Пример портфолио · Алматы</p></div>`:'<div class="card"><p>Мероприятия пока не добавлены.</p></div>'}<button class="secondary" id="add-portfolio">＋ Добавить мероприятие</button></div>`}
function description(){const d=S.formData;return`<div class="fields"><button class="secondary" id="ai-fill">✦ Заполнить с ИИ</button><textarea data-field="description" rows="8" placeholder="Расскажите о себе">${esc(d.description)}</textarea><div class="hint">ИИ использует заполненные поля и открытую информацию Instagram. Перед публикацией текст можно изменить.</div></div>`}
function form(){initForm();const tabs=['Основное','Контакты','Фото и видео','Особенности','Пакеты','Портфолио','Описание'],views=[basic,contacts,media,features,packages,portfolio,description],pct=completion();screen.innerHTML=`<div class="progressbox"><b>Карточка заполнена на ${pct}%</b><p>${S.formData.packages?'Чем больше данных, тем точнее подборки.':'Добавьте пакеты, и вы начнёте попадать в подборки.'}</p><div class="progressline"><i style="width:${pct}%"></i></div></div><div class="tabs">${tabs.map((x,i)=>`<button class="${S.tab===i?'on':''}" data-tab="${i}">${x}</button>`).join('')}</div><h1>${tabs[S.tab]}</h1>${views[S.tab]()}`;screen.querySelectorAll('[data-field]').forEach(el=>{const save=()=>{S.formData[el.dataset.field]=el.value;const p=completion();document.querySelector('.progressbox b').textContent=`Карточка заполнена на ${p}%`;document.querySelector('.progressline i').style.width=p+'%'};el.oninput=save;el.onchange=save});screen.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;form()});screen.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{const key=b.dataset.feature,i=+b.dataset.index;S.formData[key]=i<S.formData[key]?i:Math.max(S.formData[key],i+1);form()});$('#add-media')?.addEventListener('click',()=>{S.formData.media=3;form()});$('#add-package')?.addEventListener('click',()=>{S.formData.packages++;form()});$('#add-portfolio')?.addEventListener('click',()=>{S.formData.portfolio++;form()});$('#ai-fill')?.addEventListener('click',()=>{S.formData.description='Провожу современные казахские свадьбы на двух языках. Бережно работаю с традициями и готовлю персональный сценарий.';form()});foot(S.tab<tabs.length-1?'Сохранить и дальше':'Отправить на проверку',()=>{if(S.tab<tabs.length-1){S.tab++;form()}else go('submitted')},'Сохранить черновик',()=>{S.notice={title:'Черновик сохранён',text:`Заполнено ${completion()}%. Можно вернуться и продолжить в любое время.`,returnTo:'form'};go('notice')})}
function submitted(){const states=[['Проверяем','Робот сверяет телефон, Instagram и сайт. Обычно это занимает несколько минут.'],['Нужно уточнить','Instagram указан верно, но на сайте не найден этот номер. Подтвердите новый номер или добавьте ссылку на профиль.'],['Проверено','Контакты, Instagram и сайт подтверждены. Карточка доступна заказчикам.']],st=states[S.status];screen.innerHTML=`<div class="kicker">КАРТОЧКА ОТПРАВЛЕНА</div><h1>Проверка данных</h1><div class="card status ${S.status===2?'ok':''}"><span class="dot"></span><div><h2>${st[0]}</h2><p>${st[1]}</p></div></div>${S.status===1?`<div class="card"><h2>Что уточнить</h2><p>Подтвердите номер +7 701 ••• •• 48 или укажите актуальный номер WhatsApp.</p><button class="secondary">Исправить номер</button></div>`:''}<div class="hint">Ручная модерация не требуется. Заявки могут приходить и при неполной карточке.</div>`;foot(S.status<2?'Обновить статус':'Посмотреть глазами заказчика',()=>{if(S.status<2){S.status++;submitted()}else go('customer')},'Вернуться к анкете',()=>go('form'))}
function customer(){screen.innerHTML=`<div class="customer-hero"><img src="${photos[0]}"></div><div class="customer-body"><div class="badges"><span class="badge ok">✓ Проверено · демо</span><span class="badge">Қазақша</span><span class="badge">Русский</span></div><h1>Нұрлан Асылбек · демонстрационная карточка</h1><p>Ведущий и асаба · Алматы</p><div class="card why"><h2>Почему подходит вам</h2><p>Проводит двуязычные свадьбы до 300 гостей, знает казахские традиции и укладывается в выбранный средний диапазон.</p></div><h2 style="margin-top:20px">Пакеты</h2><div class="package"><strong>Демонстрационный пакет «Той»</strong><p>Ведение, персональный сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸</div></div><h2 style="margin-top:20px">Традиции и формат</h2><div class="chips">${['Беташар','Той бастар','Құдалық','Двуязычное ведение'].map(x=>chip(x,false)).join('')}</div><h2 style="margin-top:20px">Пример портфолио</h2><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><div class="card" style="margin-top:18px"><h2>Что проверено</h2><p>В мокапе показан пример будущего статуса. Реальные проверки не выполнялись.</p></div></div>`;footer.innerHTML=`<div class="actions" style="width:100%"><button class="primary">Свободна ли дата</button><button class="secondary">В мой план</button><button class="secondary">Сравнить</button></div>`}
render();
</script></body></html>
