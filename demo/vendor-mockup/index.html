padding:10px}.hint{padding:13px;border-radius:15px;background:var(--soft);color:#7d351d;font-size:13px}.phone-mask{font-size:25px;font-weight:850;letter-spacing:.04em;margin:20px 0}.code{display:flex;gap:8px;margin:18px 0}.code input{width:100%;height:54px;text-align:center;font-size:24px;border:1px solid var(--line);border-radius:13px}.progressbox{position:sticky;top:65px;z-index:4;margin:-22px -18px 18px;padding:13px 18px;background:#fbfaf8;border-bottom:1px solid var(--line)}.progressline{height:7px;background:#e8e3dd;border-radius:999px;overflow:hidden;margin-top:9px}.progressline i{display:block;height:100%;background:var(--accent);width:60%;border-radius:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin:0 -18px 18px;padding:0 18px 5px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;font-weight:750}.tabs button.on{background:var(--ink);color:white}.fields{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}.required:after{content:" *";color:var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 11px}.chip.on{border-color:var(--accent);background:var(--soft);color:#a43a17}.upload{display:grid;place-items:center;min-height:125px;border:1px dashed #c8c1b8;border-radius:17px;background:#fff;color:var(--muted);text-align:center}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px}.package{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}.package strong{display:block;margin-bottom:5px}.footer{position:fixed;z-index:7;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fbfaf8ee;backdrop-filter:blur(18px);border-top:1px solid var(-- .profile-button{margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}.profile-head img{width:78px;height:78px;border-radius:50%;object-fit:cover}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 22px}.quick-grid button{min-height:78px;border:0;border-radius:17px;background:#fff;padding:9px 4px;font-size:11px;font-weight:750}.quick-grid b{display:block;font-size:20px;margin-bottom:6px}.menu-block{overflow:hidden;padding:0}.menu-row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.menu-row:last-child{border-bottom:0}.menu-row strong{display:block}.menu-row small{display:block;color:var(--muted);margin-top:3px}.menu-row em{margin-left:auto;color:var(--muted);font-style:normal}.cabinet-stat{display:grid;grid-template-columns:1fr auto;gap:8px}.cabinet-stat strong{font-size:24px}
.profile-avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#222;color:#fff;font-size:23px;font-weight:850}.pro-entry{width:100%;margin-top:18px;padding:20px;border:0;border-radius:20px;background:#20201f;color:#fff;text-align:left}.pro-entry strong,.pro-entry small{display:block}.pro-entry strong{font-size:19px}.pro-entry small{margin-top:7px;color:#ccc;line-height:1.4}.role-grid{display:grid;gap:10px;margin-top:18px}.role-card{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:left}.role-card i{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--soft);font-size:22px;font-style:normal}.role-card b,.role-card small{display:block}.role-card small{color:var(--muted);margin-top:4px}.step-label{font-size:12px;color:var(--accent);font-weight:800}.cabinet-top{padding:18px;border-radius:20px;background:#fff}.cabinet-leads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.cabinet-leads button{min-height:100px;border:0;border-radius:20px;background:#fff;text-align:left;padding:15px}.cabinet-leads button:first-child{background:#222;color:#fff}.cabinet-leads b,.cabinet-leads small{display:block}.cabinet-leads b{font-size:20px}.pro-nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;gap:2px}.pro-nav button{border:0;background:transparent;font-size:10px;padding:5px 1px}.pro-nav b{display:block;font-size:19px;margin-bottom:3px}.logout{width:100%;margin-top:18px;border:0;background:transparent;color:#b94723;padding:14px}
</style></head><body><main class="app"><header class="top"><button class="back" id="back">‹</button><button class="logo" id="home" style="border:0;background:none"><i>e.</i> Eventer</button><button class="profile-button" id="profile" aria-label="Профиль">👤</button></header><section class="content" id="screen"></section><footer class="footer" id="footer"></footer></main>
<script>
const $=s=>document.querySelector(s),screen=$('#screen'),footer=$('#footer'),back=$('#back'),profileButton=$('#profile');
const photos=['../wedding-references/venues/3.jpg','../wedding-references/ceremony/5.jpg','../wedding-references/decor/5.jpg'];
const roles=['Площадка','Ивент-агентство','Rental','Артист','Специалист'],events=['Свадьба','Қыз ұзату','Құдалық','Сырға салу','Тұсау кесу','Бесік той','Шілдехана','Сүндет той','Юбилей','Корпоратив'],styles=['Традиционный асаба','Национальный ведущий','Двуязычное ведение','Современный формат'],options=['Своя аппаратура','Сценарий под ключ','Выезд в область'],rites=['Беташар','Сырға салу','Шашу'];
const roleDetails={
 'Площадка':['⌂','ресторан, банкетный зал, отель, загородный комплекс'],
 'Ивент-агентство':['✦','организация событий под ключ'],
 'Rental':['▦','аренда мебели, декора, звука, света, сцены'],
 'Артист':['♪','ведущий, певец, музыканты, шоу-программа'],
 'Специалист':['◎','фотограф, видеограф, декоратор, визажист, кондитер']
};
let S={page:'profile',history:[],logged:false,proType:null,found:false,verified:false,tab:0,status:0,prefill:false,notice:null,formData:null,hasCard:false,selected:null,applicationId:null,applicationStatus:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API='https://hgzxowfegmvxqtryphbd.supabase.co/rest/v1/rpc/',KEY='sb_publishable_LSSMoXyNchkWJ7c2gIdGxA_GRPdZcWX';
async function rpc(fn,body){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);try{const r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});if(!r.ok)throw new Error('Код '+r.status);return await r.json()}finally{clearTimeout(t)}}
function go(page,push=true){if(page==='submitted')S.hasCard=true;S.page=page;sessionStorage.setItem('eventerVendor',JSON.stringify(S));if(push)history.pushState({page},'',`#${page}`);render()}function navBack(){if(history.length>1)history.back();else location.assign('../#start')}
function foot(primary,action,secondary='',secondaryAction=null){footer.innerHTML=`${secondary?`<button class="secondary" id="second">${secondary}</button>`:''}<button class="primary" id="next">${primary}</button>`;$('#next').onclick=action;if(secondary)$('#second').onclick=secondaryAction}
function render(){back.style.visibility='visible';window.scrollTo(0,0);({search,who,verify,newPhone,notice,form,submitted,customer,profile,cabinet})[S.page]()}back.onclick=navBack;profileButton.onclick=()=>S.page!=='profile'&&go('profile');document.querySelector('#home').onclick=()=>location.assign('../#start');addEventListener('popstate',()=>{const page=location.hash.slice(1)||'profile';if(({search,who,verify,newPhone,notice,form,submitted,customer,profile,cabinet})[page]){S.page=page;render()}else location.assign('../#start')});
function who(){footer.innerHTML='';screen.innerHTML=`<div class="step-label">ШАГ 1 ИЗ 2</div><h1>Кто вы?</h1><p>Выберите, как вы работаете в индустрии событий.</p><div class="role-grid">${roles.map(x=>`<button class="role-card" data-role="${esc(x)}"><i>${roleDetails[x][0]}</i><span><b>${esc(x)}</b><small>${esc(roleDetails[x][1])}</small></span><em>›</em></button>`).join('')}</div>`;screen.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.proType=b.dataset.role;S.selected=null;S.formData=null;go('search')})}
function search(){if(!S.proType){go('who');return}screen.innerHTML=`<div class="step-label">ШАГ 2 ИЗ 2 · ${esc(S.proType)}</div><h1>Вы уже есть в Eventer?</h1><p>Найдите карточку по названию, Instagram или телефону.</p><div class="search"><input id="q" placeholder="Название, Instagram или телефон"><button id="find">Найти</button></div><div id="results"></div><div class="hint" style="margin-top:16px">После «Это я» придёт код в WhatsApp на номер из карточки. Пока номер не подтверждён, карточка не меняется.</div>`;footer.innerHTML=`<button class="secondary" id="create">Меня нет — создать карточку</button>`;$('#find').onclick=showResults;$('#q').onkeydown=e=>e.key==='Enter'&&showResults();$('#create').onclick=()=>{S.prefill=false;S.formData=null;go('form')}}
const matchesType=x=>{const hay=`${x.role||''} ${x.category||''}`.toLowerCase(),need={"Площадка":["площад","зал","ресторан","отель"],"Ивент-агентство":["агент","организ"],"Rental":["подряд","rental","аренд","звук","свет","декор"],"Артист":["артист","ведущ","пев","музык","шоу"],"Специалист":["специал","фото","видео","визаж","кондитер"]}[S.proType]||[];return need.some(k=>hay.includes(k))};
async function showResults(){const q=$('#q').value.trim(),box=$('#results');if(q.length<3){box.innerHTML='<div class="hint">Введите минимум 3 символа.</div>';return}box.innerHTML='<div class="hint">Ищем карточку…</div>';try{const all=await rpc('pub_vendor_search',{q}),rows=all.filter(matchesType);S.found=true;box.innerHTML=rows.length?`<div class="stack">${rows.map((x,i)=>`<div class="card result"><div class="avatar"></div><div><b>${esc(x.name)}</b><small>${esc(x.category||x.role||'пока нет данных')} · ${esc(x.city||'город не указан')}<br>${esc(x.instagram||'Instagram не указан')} ${x.phone_hint?'· '+esc(x.phone_hint):''}</small></div><button data-mine="${i}">Это я</button></div>`).join('')}</div>`:'<div class="hint">Среди выбранного типа карточка не найдена. Создайте новую.</div>';box.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>claim(rows[+b.dataset.mine]))}catch(e){box.innerHTML='<div class="hint">Не удалось загрузить, попробуйте ещё раз.</div><button class="secondary" id="retry-search">Повторить</button>';$('#retry-search').onclick=showResults}}
async function claim(row){S.selected=row;screen.innerHTML='<div class="kicker">ЗАЯВКА</div><h1>Отправляем запрос…</h1>';footer.innerHTML='';try{const a={kind:'claim',participant_id:row.id,name:row.name,city:row.city||'Алматы',category:S.proType,phone:''},res=await rpc('pub_vendor_apply',{a});S.applicationId=res.id;S.applicationStatus=res.status;go('submitted')}catch(e){S.notice={title:'Не удалось отправить',text:'Попробуйте ещё раз. Карточка не изменена.',returnTo:'search'};go('notice')}}
function verify(){screen.innerHTML=`<div class="kicker">ПОДТВЕРЖДЕНИЕ</div><h1>Подтвердите, что карточка ваша</h1><div class="card"><b>Нұрлан Асылбек · демонстрационная карточка</b><p>Отправим код в WhatsApp на номер из карточки.</p><div class="phone-mask">+7 700 ••• •• 01</div><div class="hint">Пока номер не подтверждён, данные карточки не изменятся.</div></div>${S.sent?`<div class="code">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" value="${i<3?'7':''}">`).join('')}</div>`:''}`;if(!S.sent)foot('Получить код в WhatsApp',()=>{S.sent=true;verify()},'Указать новый номер',()=>go('newPhone'));else foot('Подтвердить',()=>{S.verified=true;S.prefill=true;S.formData=null;go('form')},'Отправить ещё раз',()=>{S.notice={title:'Код отправлен повторно',text:'Новый код отправлен в WhatsApp на +7 700 ••• •• 01.',returnTo:'verify'};go('notice')})}
function newPhone(){screen.innerHTML=`<div class="kicker">НОВЫЙ НОМЕР</div><h1>Укажите номер WhatsApp</h1><p>На него придёт код. Данные карточки изменятся только после подтверждения.</p><div class="field"><label>Номер телефона</label><input id="new-number" inputmode="tel" value="+7 "></div>`;foot('Получить код',()=>{S.notice={title:'Код отправлен',text:'Код подтверждения отправлен на новый номер WhatsApp.',returnTo:'verify'};S.sent=true;go('notice')},'Отмена',navBack)}
function notice(){const n=S.notice||{title:'Готово',text:'Действие выполнено.',returnTo:'form'};screen.innerHTML=`<div class="kicker">EVENTER</div><div class="card status ok" style="margin-top:18px"><span class="dot"></span><div><h1>${esc(n.title)}</h1><p>${esc(n.text)}</p></div></div>`;foot('Продолжить',()=>{S.page=n.returnTo;S.notice=null;render()})}
function openNotice(title,text){S.notice={title,text,returnTo:'profile'};go('notice')}
function profile(){footer.innerHTML='';if(!S.logged){screen.innerHTML=`<div class="profile-head"><div class="profile-avatar">♙</div><div><h1 style="margin-bottom:4px">Вы ещё не вошли</h1></div></div><p>Войдите, чтобы сохранить свой план, заявки и поделиться подготовкой с семьёй.</p><button class="primary" id="login" style="width:100%;margin-top:18px">Войти по номеру телефона</button><p class="screen-note">Код придёт в WhatsApp</p><div class="card menu-block" style="margin-top:18px"><button class="menu-row" data-simple="Поддержка"><span>◉</span><strong>Поддержка</strong><em>›</em></button><button class="menu-row" data-simple="Настройки"><span>⚙</span><strong>Настройки</strong><em>›</em></button><button class="menu-row" data-simple="О сервисе"><span>i</span><strong>О сервисе</strong><em>›</em></button></div><button class="pro-entry" id="pro"><strong>Eventer для профи</strong><small>Площадка, агентство, rental, артист или специалист? Получайте заказы.</small></button><button class="secondary" id="customer-demo" style="margin-top:12px">Профиль заказчика · демо</button>`;$('#login').onclick=()=>openNotice('Вход скоро появится','Код будет приходить в WhatsApp. Пока сервис авторизации не подключён.');$('#customer-demo').onclick=()=>{S.logged=true;profile()}}else{screen.innerHTML=`<div class="profile-head"><div class="profile-avatar">АТ</div><div><h1 style="margin-bottom:4px">Аян Төлеген · демо</h1><p>+7 701 ••• •• 48 · <button id="change-user" style="border:0;background:none;color:var(--accent)">Изменить</button></p></div></div><div class="quick-grid" style="grid-template-columns:1fr 1fr"><button data-simple="Поддержка"><b>◉</b>Поддержка</button><button data-simple="Настройки"><b>⚙</b>Настройки</button></div><button class="pro-entry" id="pro"><strong>Eventer для профи</strong><small>Площадка, агентство, rental, артист или специалист? Получайте заказы.</small></button><button class="secondary" id="cabinet-demo" style="margin-top:10px">Кабинет профи · демо</button><div class="card menu-block" style="margin-top:14px"><button class="menu-row" id="business"><span>▣</span><div><strong>Бизнес-аккаунт</strong></div><em>скоро</em></button><button class="menu-row" id="suggest"><span>⌖</span><div><strong>Подсказать место или исправить ошибку</strong></div><em>›</em></button><button class="menu-row" data-simple="О сервисе"><span>i</span><strong>О сервисе</strong><em>›</em></button></div><button class="logout" id="logout">Выйти</button>`;$('#change-user').onclick=()=>openNotice('Изменить данные','Редактирование профиля появится после подключения входа.');$('#cabinet-demo').onclick=()=>go('cabinet');$('#business').onclick=()=>openNotice('Бизнес-аккаунт','Раздел появится позже.');$('#suggest').onclick=()=>openNotice('Подсказать место или исправить ошибку','Здесь можно будет отправить новое место или сообщить об ошибке.');$('#logout').onclick=()=>{S.logged=false;profile()}}screen.querySelectorAll('[data-simple]').forEach(b=>b.onclick=()=>openNotice(b.textContent.trim(),'Раздел будет подключён к данным пользователя.'));$('#pro').onclick=()=>S.hasCard?go('cabinet'):go('who')}
function cabinet(){footer.innerHTML=`<div class="pro-nav">${[['⌂','Главная'],['✉','Заявки'],['✦','Ассистент'],['▦','Календарь'],['●','Моя карточка']].map(x=>`<button><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>`;screen.innerHTML=`<div class="kicker">КАБИНЕТ ПРОФИ · ДЕМО</div><div class="cabinet-top"><div class="badges"><span class="badge ok">✓ Проверено</span></div><h1>Студия «Мереке» · демо</h1><p>${esc(S.proType||'Ивент-агентство')} · Алматы</p><b>Карточка заполнена 68%</b><div class="progressline"><i style="width:68%"></i></div><p>Добавьте пакеты и цены, чтобы чаще попадать в подборки.</p></div><div class="cabinet-leads"><button id="inbox"><b>3 новые заявки</b><small>Открыть заявки</small></button><button id="waiting"><b>2 ждут ответа</b><small>Ответить сегодня</small></button></div><div class="card menu-block"><button class="menu-row" id="calendar"><span>▦</span><strong>Календарь занятости</strong><em>›</em></button><button class="menu-row" id="prices"><span>₸</span><div><strong>Пакеты и цены</strong></div><em>добавить</em></button><button class="menu-row" id="portfolio"><span>▧</span><strong>Фото и реальные события</strong><em>›</em></button><button class="menu-row" id="edit-card"><span>✎</span><strong>Редактировать карточку</strong><em>›</em></button></div><button class="secondary" id="customer-mode" style="margin-top:16px">Перейти в режим заказчика</button>`;$('#edit-card').onclick=()=>{S.tab=0;go('form')};$('#prices').onclick=()=>{S.tab=4;go('form')};['inbox','waiting','calendar','portfolio'].forEach(id=>$('#'+id).onclick=()=>{S.notice={title:$('#'+id).textContent.trim(),text:'Демонстрационный раздел кабинета профи.',returnTo:'cabinet'};go('notice')});$('#customer-mode').onclick=()=>go('profile')}
const chip=(x,on=true)=>`<button class="chip ${on?'on':''}">${esc(x)}</button>`;
function initForm(){if(S.formData)return;const x=S.selected||{};S.formData=S.prefill?{role:S.proType,category:S.proType,name:x.name||'',city:x.city||'Алматы',experience:'',phone:'',whatsapp:'',instagram:x.instagram||'',telegram:'',site:'',media:0,languages:0,eventTypes:0,styles:0,options:0,rites:0,packages:0,portfolio:0,description:''}:{role:S.proType,category:S.proType,name:'',city:'Алматы',experience:'',phone:'',whatsapp:'',instagram:'',telegram:'',site:'',media:0,languages:0,eventTypes:0,styles:0,options:0,rites:0,packages:0,portfolio:0,description:''}}
function completion(){initForm();const d=S.formData,checks=[d.role,d.category,d.name,d.city,d.experience,d.phone,d.whatsapp,d.instagram,d.telegram,d.site,d.media,d.languages,d.eventTypes,d.styles,d.options,d.rites,d.packages,d.portfolio,d.description];return Math.round(checks.filter(Boolean).length/checks.length*100)}
function basic(){const d=S.formData;return`<div class="fields"><div class="hint"><b>${esc(S.proType)}</b><br>Тип выбран на предыдущем шаге и будет записан в заявку.</div><div class="field"><label class="required">Название</label><input data-field="name" value="${esc(d.name)}" placeholder="Имя или название организации"></div><div class="field"><label class="required">Город</label><select data-field="city"><option ${d.city==='Алматы'?'selected':''}>Алматы</option><option ${d.city==='Астана'?'selected':''}>Астана</option><option ${d.city==='Шымкент'?'selected':''}>Шымкент</option></select></div><div class="field"><label>Опыт</label><input data-field="experience" value="${esc(d.experience)}" inputmode="numeric" placeholder="Лет"></div></div>`}
function contacts(){const d=S.formData;return`<div class="fields"><div class="field"><label class="required">Телефон</label><input data-field="phone" value="${esc(d.phone)}"></div><div class="field"><label>WhatsApp</label><input data-field="whatsapp" value="${esc(d.whatsapp)}"></div><div class="field"><label>Instagram</label><input data-field="instagram" value="${esc(d.instagram)}"></div><div class="field"><label>Telegram</label><input data-field="telegram" value="${esc(d.telegram)}" placeholder="@username"></div><div class="field"><label>Сайт</label><input data-field="site" value="${esc(d.site)}" placeholder="https://"></div></div>`}
function media(){const d=S.formData;return`<div class="fields"><button class="upload" id="add-media"><b>＋ Добавить обложку</b><span>Фото или видео</span></button>${d.media?`<div class="gallery">${photos.slice(0,d.media).map(x=>`<img src="${x}">`).join('')}</div>`:'<div class="hint">Фото и видео пока не добавлены.</div>'}<div class="field"><label>YouTube</label><input placeholder="Ссылка на видео"></div><div class="field"><label>Reels</label><input placeholder="Ссылка на Reels"></div></div>`}
function featureChips(list,key){return list.map((x,i)=>`<button class="chip ${i<S.formData[key]?'on':''}" data-feature="${key}" data-index="${i}">${esc(x)}</button>`).join('')}
function features(){return`<div class="fields"><div class="field"><label>Языки</label><div class="chips">${featureChips(['Қазақша','Русский','English'],'languages')}</div></div><div class="field"><label>Типы праздников</label><div class="chips">${featureChips(events,'eventTypes')}</div></div><div class="field"><label>Стиль</label><div class="chips">${featureChips(styles,'styles')}</div></div><div class="field"><label>Опции</label><div class="chips">${featureChips(options,'options')}</div></div><div class="field"><label>Обряды</label><div class="chips">${featureChips(rites,'rites')}</div></div></div>`}
function packages(){const d=S.formData;return`<div class="hint">Минимум один пакет. Эти цены используются при подборе по уровням Эконом / Средний / Премиум.</div><div class="stack" style="margin-top:14px">${d.packages?`<div class="package"><strong>Демонстрационный пакет «Той»</strong><p>Ведение на двух языках, сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸ · за вечер</div></div>`:'<div class="card"><p>Пакеты пока не добавлены.</p></div>'}<button class="secondary" id="add-package">＋ Добавить пакет</button></div>`}
function portfolio(){const d=S.formData;return`<div class="stack">${d.portfolio?`<div class="card"><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><h2 style="margin-top:12px">Демонстрационная свадьба</h2><p>Пример портфолио · Алматы</p></div>`:'<div class="card"><p>Мероприятия пока не добавлены.</p></div>'}<button class="secondary" id="add-portfolio">＋ Добавить мероприятие</button></div>`}
function description(){const d=S.formData;return`<div class="fields"><button class="secondary" id="ai-fill">✦ Заполнить с ИИ</button><textarea data-field="description" rows="8" placeholder="Расскажите о себе">${esc(d.description)}</textarea><div class="hint">ИИ использует заполненные поля и открытую информацию Instagram. Перед публикацией текст можно изменить.</div></div>`}
async function submitApplication(){const d=S.formData;if(!d.name||!d.city||!d.category||!d.phone){S.notice={title:'Заполните обязательные поля',text:'Нужны название, город и телефон.',returnTo:'form'};go('notice');return}screen.innerHTML='<div class="kicker">АНКЕТА</div><h1>Отправляем…</h1>';footer.innerHTML='';try{const a={kind:'new',name:d.name,city:d.city,category:S.proType,phone:d.phone,role:S.proType,whatsapp:d.whatsapp,instagram:d.instagram,telegram:d.telegram,website:d.site,description:d.description};const res=await rpc('pub_vendor_apply',{a});S.applicationId=res.id;S.applicationStatus=res.status;S.hasCard=true;go('submitted')}catch(e){screen.innerHTML='<div class="kicker">ОШИБКА</div><h1>Не удалось отправить</h1><p>Не удалось загрузить, попробуйте ещё раз.</p>';foot('Повторить',submitApplication,'Вернуться',()=>go('form'))}}
function form(){initForm();const tabs=['Основное','Контакты','Фото и видео','Особенности','Пакеты','Портфолио','Описание'],views=[basic,contacts,media,features,packages,portfolio,description],pct=completion();screen.innerHTML=`<div class="progressbox"><b>Карточка заполнена на ${pct}%</b><p>${S.formData.packages?'Чем больше данных, тем точнее подборки.':'Добавьте пакеты, и вы начнёте попадать в подборки.'}</p><div class="progressline"><i style="width:${pct}%"></i></div></div><div class="tabs">${tabs.map((x,i)=>`<button class="${S.tab===i?'on':''}" data-tab="${i}">${x}</button>`).join('')}</div><h1>${tabs[S.tab]}</h1>${views[S.tab]()}`;screen.querySelectorAll('[data-field]').forEach(el=>{const save=()=>{S.formData[el.dataset.field]=el.value;const p=completion();document.querySelector('.progressbox b').textContent=`Карточка заполнена на ${p}%`;document.querySelector('.progressline i').style.width=p+'%'};el.oninput=save;el.onchange=save});screen.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.tab;form()});screen.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{const key=b.dataset.feature,i=+b.dataset.index;S.formData[key]=i<S.formData[key]?i:Math.max(S.formData[key],i+1);form()});$('#add-media')?.addEventListener('click',()=>{S.formData.media=3;form()});$('#add-package')?.addEventListener('click',()=>{S.formData.packages++;form()});$('#add-portfolio')?.addEventListener('click',()=>{S.formData.portfolio++;form()});$('#ai-fill')?.addEventListener('click',()=>{S.formData.description='Провожу современные казахские свадьбы на двух языках. Бережно работаю с традициями и готовлю персональный сценарий.';form()});foot(S.tab<tabs.length-1?'Сохранить и дальше':'Отправить на проверку',()=>{if(S.tab<tabs.length-1){S.tab++;form()}else submitApplication()},'Сохранить черновик',()=>{S.notice={title:'Черновик сохранён',text:`Заполнено ${completion()}%. Можно вернуться и продолжить в любое время.`,returnTo:'form'};go('notice')})}
function submitted(){const map={pending:['Проверяем','Робот сверяет открытые данные.'],needs_info:['Нужно уточнить','Откройте пояснение ниже и дополните анкету.'],verified:['Проверено','Карточка подтверждена.'],rejected:['Отклонено','Заявка не прошла проверку.']},st=map[S.applicationStatus]||map.pending;screen.innerHTML=`<div class="kicker">КАРТОЧКА ОТПРАВЛЕНА</div><h1>${st[0]}</h1><div class="card status ${S.applicationStatus==='verified'?'ok':''}"><span class="dot"></span><div><p>${esc(st[1])}</p><p>${esc(S.applicationNote||'')}</p></div></div><div class="hint">Код WhatsApp пока не подключён. Заявка уже передана на проверку.</div>`;foot('Обновить статус',async()=>{if(!S.applicationId)return;try{const res=await rpc('pub_vendor_application_status',{p_id:S.applicationId});S.applicationStatus=res.status;S.applicationNote=res.note;submitted()}catch(e){S.notice={title:'Не удалось загрузить',text:'Попробуйте ещё раз.',returnTo:'submitted'};go('notice')}},'Вернуться к анкете',()=>go('form'))}
function customer(){screen.innerHTML=`<div class="customer-hero"><img src="${photos[0]}"></div><div class="customer-body"><div class="badges"><span class="badge ok">✓ Проверено · демо</span><span class="badge">Қазақша</span><span class="badge">Русский</span></div><h1>Нұрлан Асылбек · демонстрационная карточка</h1><p>Ведущий и асаба · Алматы</p><div class="card why"><h2>Почему подходит вам</h2><p>Проводит двуязычные свадьбы до 300 гостей, знает казахские традиции и укладывается в выбранный средний диапазон.</p></div><h2 style="margin-top:20px">Пакеты</h2><div class="package"><strong>Демонстрационный пакет «Той»</strong><p>Ведение, персональный сценарий, конкурсы, работа 6 часов</p><div class="price">650 000 ₸</div></div><h2 style="margin-top:20px">Традиции и формат</h2><div class="chips">${['Беташар','Той бастар','Құдалық','Двуязычное ведение'].map(x=>chip(x,false)).join('')}</div><h2 style="margin-top:20px">Пример портфолио</h2><div class="gallery">${photos.map(x=>`<img src="${x}">`).join('')}</div><div class="card" style="margin-top:18px"><h2>Что проверено</h2><p>В мокапе показан пример будущего статуса. Реальные проверки не выполнялись.</p></div></div>`;footer.innerHTML=`<div class="actions" style="width:100%"><button class="primary">Свободна ли дата</button><button class="secondary">В мой план</button><button class="secondary">Сравнить</button></div>`}
try{const saved=JSON.parse(sessionStorage.getItem('eventerVendor')||'null');if(saved)S={...S,...saved}}catch{}const initial=location.hash.slice(1);if(initial&&({search,who,verify,newPhone,notice,form,submitted,customer,profile,cabinet})[initial])S.page=initial;render();
</script></body></html>
