function wishes(){const n=Object.values(S.wishes).filter(Boolean).length;screen.innerHTML=`${pill()}<h1>Что хотите на свадьбе?</h1><p>Отметьте всё, что нужно. Технику и кухню мы добавим сами, если понадобятся.</p><div class="chips">${WISHES.map(w=>opt(S.wishes[w[0]],`data-wish="${w[0]}"`,w[1])).join('')}</div>`;nav(`Дальше · ${n+1} ${n?'пунктов':'пункт'}`);screen.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{S.wishes[b.dataset.wish]=!S.wishes[b.dataset.wish];wishes()});footer.querySelector('#next').onclick=()=>{prepareLevels();go('pricing')}}
function plan(){const items=[],add=(code,why)=>{if(!items.find(x=>x.code===code))items.push({code,why})};if(S.path==='organizer')add('organizer','ведёт всю подготовку');if(S.where==='hall'||S.where==='unknown')add('venue','');if(S.where==='nokitchen'){add('venue','');add('catering','на площадке нет своей кухни')}if(S.where==='outdoor'){add('catering','праздник не в ресторане');add('tech','праздник не в ресторане — нужен звук и свет')}WISHES.forEach(w=>{if(S.wishes[w[0]])w[2].forEach(c=>add(c,''))});if((S.wishes.show||S.wishes.dj)&&S.where==='nokitchen')add('tech','живая музыка или DJ, а на площадке своего оборудования может не быть');return items}
const labelFor=code=>({venue:'Площадка и банкет',catering:'Кейтеринг',organizer:'Организатор',host:'Ведущий',photo:'Фотограф',video:'Видеограф',show:'Артисты',dj:'DJ и танцы',decor:'Декор и флористика',ceremony:'Выездная регистрация',cake:'Свадебный торт',transport:'Транспорт',dress:'Платье',makeup:'Образ невесты',suit:'Костюм жениха',print:'Приглашения',tech:'Звук и свет'})[code]||code;
const rangeFor=(code,tier)=>PRICE[code]?.[tier]||[[150000,250000],[350000,600000],[800000,1200000]][tier];
const lineAmount=(code,tier)=>{const r=rangeFor(code,tier),mid=(r[0]+r[1])/2;return(code==='venue'||code==='catering')?mid*(S.guests||1):mid};
function chooseTier(code,target){const per=code==='venue'||code==='catering',value=per?target/(S.guests||1):target;for(let i=0;i<3;i++){const r=rangeFor(code,i);if(value<=r[1])return i}return 2}

function budgetBounds(){if(S.budget===null||S.budget===undefined||S.budget===5)return null;return[[0,3e6],[3e6,6e6],[6e6,10e6],[10e6,20e6],[20e6,Infinity]][S.budget]}
function budgetState(bp){const bounds=budgetBounds();if(!bounds)return`Ориентировочный план: ${mln(bp.total)}. Бюджет ещё не задан — превышение не рассчитываем.`;const[low,high]=bounds;if(bp.total>high)return`Превышение ${mln(bp.total-high)} относительно верхней границы бюджета — где сэкономить?`;if(bp.total<low)return`Свободно минимум ${mln(low-bp.total)} до выбранного диапазона — можно повысить уровень отдельных услуг.`;return'В пределах выбранного бюджета.'}

function totalBudget(){const b=S.budget===null||S.budget===undefined?null:BUDGET_TARGETS[S.budget];if(b)return{sum:b,guess:false,label:BUDGETS[S.budget][0]};const pg=S.style==='lux'?70000:S.style==='intimate'?45000:40000;return{sum:S.guests*pg,guess:true,label:'Не знаю'}}
