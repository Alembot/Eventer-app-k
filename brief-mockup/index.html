<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4d03">
  <title>Eventer — свадебный бриф</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <style>
    :root{--orange:#ff4d03;--ink:#171717;--muted:#74706b;--bg:#f5f3ef;--card:#fff;--line:#e8e4de;--soft:#fff0e9}
    *{box-sizing:border-box}body{margin:0;background:#dfddd8;color:var(--ink);font:15px/1.42 Onest,system-ui,sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}.phone{width:min(100%,430px);min-height:100svh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
    header{height:66px;padding:0 17px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
    .logo{font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--orange);margin-right:auto}.close,.back{width:38px;height:38px;border:0;border-radius:50%;background:#f1efeb;font-size:18px;display:grid;place-items:center}.close{text-decoration:none}
    .progress{height:3px;background:#e5e0da;position:sticky;top:66px;z-index:10}.progress i{display:block;height:100%;width:0;background:var(--orange);transition:width .25s}
    main{padding:25px 18px 130px}.kicker{margin:0 0 8px;color:var(--orange);font-size:11px;font-weight:800;letter-spacing:1.1px}.stepcount{color:var(--muted);font-size:12px}
    h1{margin:9px 0 8px;font-size:30px;line-height:1.06;letter-spacing:-1.1px}h2{margin:0;font-size:17px}p{margin:0;color:var(--muted)}
    .hero{min-height:260px;border-radius:28px;padding:26px 22px;color:#fff;background:linear-gradient(145deg,#ff4d03,#fd7641 60%,#f7a37e);display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 18px 45px #ff4d0335}
    .hero .mark{width:48px;height:48px;border-radius:17px;background:#fff;color:var(--orange);display:grid;place-items:center;font-weight:900;font-size:25px;margin-bottom:auto}.hero h1{font-size:34px}.hero p{color:#fff9;font-size:16px}
    .intro-list{display:grid;gap:9px;margin-top:16px}.intro-list div{background:#fff;padding:12px 14px;border:1px solid var(--line);border-radius:16px;display:flex;gap:11px;align-items:center}.intro-list b{color:var(--orange)}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.choice{min-height:84px;padding:15px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:5px}.choice b{font-size:15px}.choice small{color:var(--muted);line-height:1.25}.choice.on{border-color:var(--orange);background:var(--soft);box-shadow:0 0 0 1px var(--orange)}.choice.wide{grid-column:1/-1;min-height:66px}
    .fields{display:grid;gap:14px;margin-top:22px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;height:54px;padding:0 14px;border:1.5px solid var(--line);border-radius:16px;background:#fff;outline:none}.field textarea{height:90px;padding-top:13px;resize:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chip{border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;background:#fff}.chip.on{border-color:var(--orange);background:var(--orange);color:#fff}
    .notice{margin-top:18px;padding:14px;border-radius:16px;background:#fff7e8;color:#6e4a12;font-size:13px}.notice b{display:block;margin-bottom:3px}
    .footer{position:fixed;z-index:11;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f5f3ef 20%,#f5f3ef)}
    .next{width:100%;height:54px;border:0;border-radius:17px;background:var(--orange);color:#fff;font-weight:800;box-shadow:0 9px 22px #ff4d0333}.next:disabled{opacity:.35;box-shadow:none}.skip{width:100%;margin-top:5px;border:0;background:none;color:var(--muted);padding:7px}
    .summary{display:grid;gap:10px;margin-top:20px}.summary section{padding:15px;border-radius:18px;background:#fff;border:1px solid var(--line)}.summary section div{margin-top:7px;color:var(--muted)}
    .score{display:flex;align-items:center;gap:14px;margin:18px 0}.score strong{font-size:34px;color:var(--orange)}.score i{display:block;height:7px;flex:1;border-radius:9px;background:linear-gradient(90deg,var(--orange) 78%,#e7e2dc 78%)}
    .result-actions{display:grid;gap:9px;margin-top:17px}.result-actions button{height:50px;border-radius:15px;border:1.5px solid var(--line);background:#fff;font-weight:700}.result-actions .primary{background:var(--orange);border-color:var(--orange);color:#fff}
    .tag{display:inline-flex;margin:5px 5px 0 0;padding:5px 9px;background:#f1efeb;border-radius:999px;font-size:12px}.hidden{display:none}
    @media(max-width:370px){h1{font-size:27px}.choices{grid-template-columns:1fr}.choice.wide{grid-column:auto}.hero h1{font-size:30px}}
  </style>
</head>
<body><div class="phone">
  <header><button class="back" id="back" aria-label="Назад">←</button><div class="logo">eventer</div><a class="close" href="../demo/" aria-label="Закрыть">×</a></header>
  <div class="progress"><i id="bar"></i></div>
  <main id="screen"></main><div class="footer" id="footer"></div>
</div>
<script>
const steps=["start","event","basics","budget","organizer","style","needs","result"];
const state={step:0,role:"",event:"",date:"",city:"Алматы",guests:"",budget:"",organizer:"",style:"",language:"",needs:[],note:""};
const screen=document.querySelector('#screen'),footer=document.querySelector('#footer'),back=document.querySelector('#back'),bar=document.querySelector('#bar');
const options=(items,key,wide=false)=>`<div class="choices">${items.map(([v,t,d])=>`<button class="choice ${wide?'wide':''} ${state[key]===v?'on':''}" data-one="${key}" data-value="${v}"><b>${t}</b>${d?`<small>${d}</small>`:''}</button>`).join('')}</div>`;
function nav(label="Далее",disabled=false,skip=""){footer.innerHTML=`<button class="next" id="next" ${disabled?'disabled':''}>${label}</button>${skip?`<button class="skip" id="skip">${skip}</button>`:''}`}
function bind(){document.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{state[b.dataset.one]=b.dataset.value;render()});document.querySelectorAll('[data-many]').forEach(b=>b.onclick=()=>{const v=b.dataset.value,i=state.needs.indexOf(v);i<0?state.needs.push(v):state.needs.splice(i,1);render()});const n=document.querySelector('#next');if(n)n.onclick=()=>{if(state.step<steps.length-1){state.step++;render()}};const s=document.querySelector('#skip');if(s)s.onclick=()=>{state.step++;render()}}
function render(){const key=steps[state.step];back.style.visibility=state.step?'visible':'hidden';bar.style.width=`${state.step/(steps.length-1)*100}%`;window.scrollTo(0,0);
 if(key==='start'){screen.innerHTML=`<section class="hero"><div class="mark">e</div><h1>Соберём свадебный бриф</h1><p>За несколько минут определим основу события и подготовим понятное задание для организатора или команды.</p></section><div class="intro-list"><div><b>01</b> Только необходимые вопросы</div><div><b>02</b> Результат можно изменить</div><div><b>03</b> Бриф останется у вас</div></div>`;nav('Начать бриф');}
 if(key==='event'){screen.innerHTML=`<span class="stepcount">1 из 6</span><p class="kicker">СОБЫТИЕ</p><h1>Что вы готовите?</h1><p>Выберите событие и свою роль в подготовке.</p>${options([["wedding","Основная свадьба",""],["uzatu","Ұзату",""],["kudalyk","Құдалық",""],["syrga","Сырға салу",""]],"event")}<div class="chips">${["Невеста","Жених","Родители","Организатор"].map(v=>`<button class="chip ${state.role===v?'on':''}" data-one="role" data-value="${v}">${v}</button>`).join('')}</div>`;nav('Далее',!state.event||!state.role);}
 if(key==='basics'){screen.innerHTML=`<span class="stepcount">2 из 6</span><p class="kicker">ОСНОВА</p><h1>Дата, город и гости</h1><p>Эти параметры определяют площадку, бюджет и доступность команды.</p><div class="fields"><div class="field"><label>Дата</label><input id="date" type="date" value="${state.date}"></div><div class="field"><label>Город</label><select id="city">${["Алматы","Астана","Шымкент","Караганда","Атырау","Актау","Другой город"].map(v=>`<option ${state.city===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Количество гостей</label><input id="guests" inputmode="numeric" type="number" placeholder="Например, 150" value="${state.guests}"></div></div>`;nav('Далее',!state.city||!state.guests);document.querySelector('#date').onchange=e=>state.date=e.target.value;document.querySelector('#city').onchange=e=>{state.city=e.target.value;render()};document.querySelector('#guests').oninput=e=>{state.guests=e.target.value;document.querySelector('#next').disabled=!e.target.value};}
 if(key==='budget'){screen.innerHTML=`<span class="stepcount">3 из 6</span><p class="kicker">БЮДЖЕТ</p><h1>Какой бюджет рассматриваете?</h1><p>Можно выбрать диапазон. Это не окончательная смета.</p>${options([["до 3 млн ₸","До 3 млн ₸",""],["3–6 млн ₸","3–6 млн ₸",""],["6–10 млн ₸","6–10 млн ₸",""],["10–20 млн ₸","10–20 млн ₸",""],["от 20 млн ₸","От 20 млн ₸",""],["Нужна консультация","Не знаю","Помогите определить реалистичный бюджет"]],"budget")}<div class="notice"><b>Бюджет можно уточнить позже</b>В итоговом брифе мы покажем, какие решения сильнее всего влияют на стоимость.</div>`;nav('Далее',!state.budget);}
 if(key==='organizer'){screen.innerHTML=`<span class="stepcount">4 из 6</span><p class="kicker">ПОДХОД</p><h1>Кто будет организовывать?</h1><p>От этого зависит глубина брифа и следующий шаг.</p>${options([["Есть организатор","Организатор уже есть","Передадим ему готовый бриф"],["Найти организатора","Нужен организатор","Подготовим запрос для агентства или продюсера"],["Самостоятельно","Организую самостоятельно","Соберём задачи и категории команды"]],"organizer",true)}`;nav('Далее',!state.organizer);}
 if(key==='style'){screen.innerHTML=`<span class="stepcount">5 из 6</span><p class="kicker">АТМОСФЕРА</p><h1>Какой формат вам ближе?</h1><p>Это первая гипотеза — стиль можно изменить после выбора площадки.</p>${options([["Современная","Современная","Лаконично и актуально"],["Национальная","Национальная","Традиции и современная подача"],["Классическая","Классическая","Торжественно и вне времени"],["Камерная","Камерная","Для самых близких"],["Не определён","Пока не определились","Посмотреть идеи и примеры"]],"style")}<div class="chips">${["Казахский","Русский","Казахский и русский","Другой"].map(v=>`<button class="chip ${state.language===v?'on':''}" data-one="language" data-value="${v}">${v}</button>`).join('')}</div>`;nav('Далее',!state.style||!state.language);}
 if(key==='needs'){const list=["Организатор","Площадка","Концепция и декор","Ведущий и программа","Фото и видео","Артисты и музыка","Техника","Транспорт","Образы","Приглашения","Всё вместе"];
 screen.innerHTML=`<span class="stepcount">6 из 6</span><p class="kicker">ЗАДАЧА</p><h1>С чем нужна помощь?</h1><p>Выберите крупные блоки — без длинного списка всех специалистов.</p><div class="chips">${list.map(v=>`<button class="chip ${state.needs.includes(v)?'on':''}" data-many data-value="${v}">${v}</button>`).join('')}</div><div class="fields"><div class="field"><label>Другое или важное ограничение</label><textarea id="note" placeholder="Например: нужен зал в горах, без алкоголя, семейный формат">${state.note}</textarea></div></div>`;nav('Сформировать бриф',!state.needs.length);document.querySelector('#note').oninput=e=>state.note=e.target.value;}
 if(key==='result'){const eventName={wedding:"Основная свадьба",uzatu:"Ұзату",kudalyk:"Құдалық",syrga:"Сырға салу"}[state.event];screen.innerHTML=`<p class="kicker">ГОТОВО</p><h1>Ваш свадебный бриф</h1><p>Вот что мы поняли. Всё можно изменить до отправки.</p><div class="score"><strong>78%</strong><i></i></div><div class="summary"><section><h2>${eventName}</h2><div>${state.role} · ${state.city} · ${state.guests} гостей${state.date?' · '+state.date:''}</div></section><section><h2>Бюджет и формат</h2><div>${state.budget} · ${state.style} · ${state.language}</div></section><section><h2>Организация</h2><div>${state.organizer}</div></section><section><h2>Нужна помощь</h2><div>${state.needs.map(v=>`<span class="tag">${v}</span>`).join('')}${state.note?`<p style="margin-top:10px">${state.note.replace(/[<>]/g,'')}</p>`:''}</div></section></div><div class="result-actions"><button class="primary">Сохранить бриф</button><button>Передать организатору</button><button onclick="state.step=1;render()">Изменить ответы</button></div>`;footer.innerHTML='';}
 bind();}
back.onclick=()=>{if(state.step>0){state.step--;render()}};render();
</script></body></html>
