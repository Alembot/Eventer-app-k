<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4d03">
  <title>Eventer — свадебный бриф</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <style>
    :root{--orange:#ff4d03;--ink:#171717;--muted:#74706b;--bg:#f5f3ef;--card:#fff;--line:#e8e4de;--soft:#fff0e9}
    *{box-sizing:border-box}body{margin:0;background:#dfddd8;color:var(--ink);font:15px/1.42 Onest,system-ui,sans-serif}button,input{font:inherit;color:inherit}
    .phone{width:min(100%,430px);min-height:100svh;margin:auto;background:var(--bg);position:relative;overflow:hidden}header{height:66px;padding:0 17px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
    .logo{font-size:21px;font-weight:800;letter-spacing:-1px;color:var(--orange);margin-right:auto}.close,.back{width:38px;height:38px;border:0;border-radius:50%;background:#f1efeb;font-size:18px;display:grid;place-items:center}.close{text-decoration:none}.progress{height:3px;background:#e5e0da;position:sticky;top:66px;z-index:10}.progress i{display:block;height:100%;width:0;background:var(--orange);transition:width .25s}
    main{padding:25px 18px 130px}.kicker{margin:0 0 8px;color:var(--orange);font-size:11px;font-weight:800;letter-spacing:1.1px}.stepcount{color:var(--muted);font-size:12px}h1{margin:9px 0 8px;font-size:30px;line-height:1.06;letter-spacing:-1.1px}h2{margin:0;font-size:17px}p{margin:0;color:var(--muted)}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.choice{min-height:84px;padding:15px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:5px}.choice b{font-size:15px}.choice small{color:var(--muted);line-height:1.25}.choice.on{border-color:var(--orange);background:var(--soft);box-shadow:0 0 0 1px var(--orange)}.choice.wide{grid-column:1/-1;min-height:66px}
    .fields{display:grid;gap:14px;margin-top:22px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input{width:100%;height:54px;padding:0 14px;border:1.5px solid var(--line);border-radius:16px;background:#fff;outline:none}.field input:focus{border-color:var(--orange)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chip{border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;background:#fff}.chip.on{border-color:var(--orange);background:var(--orange);color:#fff}
    .footer{position:fixed;z-index:11;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#f5f3ef 20%,#f5f3ef)}.next{width:100%;height:54px;border:0;border-radius:17px;background:var(--orange);color:#fff;font-weight:800;box-shadow:0 9px 22px #ff4d0333}.next:disabled{opacity:.35;box-shadow:none}.skip{width:100%;margin-top:5px;border:0;background:none;color:var(--muted);padding:7px}
    .event-pill{display:inline-flex;margin-bottom:10px;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--orange);font-size:12px;font-weight:800}.dots{display:flex;justify-content:center;gap:5px;margin-top:18px}.dots i{width:22px;height:4px;border-radius:4px;background:#ddd7cf}.dots i.on{background:var(--orange)}.need{display:flex;flex-direction:column;gap:12px;margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff}.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f1efeb;color:var(--muted);font-size:12px;font-weight:700}.pill.acc{background:var(--soft);color:var(--orange)}.pill.ok{background:#e8f3ec;color:#1f5c38}.pill.warn{background:#fff1df;color:#795014}.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.gap{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start}.cand{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:12px 0;border-top:1px solid var(--line)}.cand:first-child{border-top:0}.cand .nm{font-weight:800}.cand .mt{grid-column:1/-1;color:var(--muted);font-size:13px}.note{padding:12px;border-radius:14px;background:#fff7e8}.note.bad,.err{background:#fbe9e7}.err{padding:14px;border-radius:14px}.small{font-size:13px}.muted{color:var(--muted)}
    @media(max-width:370px){h1{font-size:27px}.choices{grid-template-columns:1fr}.choice.wide{grid-column:auto}}
  </style>
</head>
<body><div class="phone">
  <header><button class="back" id="back" aria-label="Назад">←</button><div class="logo">eventer</div><a class="close" href="../demo/" aria-label="Закрыть">×</a></header>
  <div class="progress"><i id="bar"></i></div><main id="screen"></main><div class="footer" id="footer"></div>
</div>
<script>
const GUIDE=[
 ["Идея и стиль","Решите, какой праздник хотите вы сами: камерный ужин, большой той или свадьба на природе. Всё остальное подстроится под это."],
 ["Бюджет и гости","Сначала общая сумма и примерное число гостей — от них зависит выбор зала. Отложите 5–8% на непредвиденное."],
 ["Дата и площадка","Площадку бронируют раньше всего: хорошие залы на лето разбирают за 6–9 месяцев. Берите зал на 10–15% больше списка гостей."],
 ["Ведущий, фото, видео","Сразу после площадки. Сильные ведущие и фотографы заняты на сезон вперёд. С каждым — договор с датой и суммой."],
 ["Декор, музыка, образы","Цвета и декор — только когда известен зал. Платье и костюм — за 3–4 месяца."],
 ["Тайминг дня","Распишите день по часам с запасом на опоздания и запасной план на случай погоды."],
 ["Сам день","Последний вечер — свободный. Все мелочи закрывайте заранее, а в день свадьбы за всё отвечает координатор."]
];
const EVENTS=[["wedding","Основная свадьба"],["uzatu","Ұзату"],["kudalyk","Құдалық"],["syrga","Сырға салу"]];
const STYLES=[["classic","Современная классика","Банкетный зал, белое и золото, большой красивый праздник"],["toi","Национальный той","Казахские традиции, беташар, асаба, много гостей"],["nature","На природе","Загородная площадка, шатёр, выездная регистрация"],["intimate","Камерная","Ужин для самых близких, 20–50 гостей"],["lux","Роскошная","Отель, авторская концепция, звёздный ведущий и артисты"]];
const CITIES=["Алматы","Астана","Шымкент","Караганда","Актобе","Атырау"],GUESTS=[30,50,100,150,200,300,500];
const BUDGETS=[["до 3 млн ₸",3e6],["3–6 млн ₸",6e6],["6–10 млн ₸",10e6],["10–20 млн ₸",20e6],["от 20 млн ₸",35e6],["Не знаю",null]];
const WHERE=[["hall","Ресторан или банкетный зал","еда входит в стоимость"],["nokitchen","Площадка без кухни","загородная, шатёр, лофт"],["outdoor","Дома или на природе",""],["unknown","Ещё не знаю","покажем варианты залов"]];
const WISHES=[["host","Ведущий",["host"]],["photo","Фото",["photo"]],["video","Видео",["video"]],["show","Живая музыка или артисты",["show"]],["dj","DJ и танцы",["dj"]],["decor","Красивое оформление зала",["decor"]],["ceremony","Выездная регистрация",["ceremony"]],["cake","Свадебный торт",["cake"]],["car","Красивая машина",["transport"]],["look","Платье и образ невесты",["dress","makeup"]],["suit","Костюм жениха",["suit"]],["print","Приглашения",["print"]]];
const WEIGHT={venue:45,catering:30,organizer:10,host:13,photo:7,video:5,dj:7,show:8,decor:8,cake:4,transport:4,dress:6,makeup:2,suit:2,ceremony:4,print:1,tech:5},RESERVE=.065;
const UNIT={per_guest:"на гостя",per_show:"за вечер",per_project:"за работу",per_item:"за единицу",per_hour:"в час"};
const API="https://hgzxowfegmvxqtryphbd.supabase.co/rest/v1/rpc/",KEY="sb_publishable_LSSMoXyNchkWJ7c2gIdGxA_GRPdZcWX";
const screen=document.querySelector('#screen'),footer=document.querySelector('#footer'),back=document.querySelector('#back'),bar=document.querySelector('#bar');
let S;function reset(){S={step:"event",event:null,g:0,style:null,date:"",city:"",guests:null,budget:null,path:null,where:null,wishes:{host:true,photo:true,decor:true},cfg:null,data:null}}reset();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=n=>Math.round(n??0).toLocaleString("ru-RU"),mln=n=>n>=1e6?(Math.round(n/1e5)/10).toLocaleString("ru-RU")+" млн ₸":num(Math.round(n/1000)*1000)+" ₸";
const eventName=()=>EVENTS.find(e=>e[0]===S.event)?.[1]||"Свадьба";
const pill=()=>S.event?`<span class="event-pill">${esc(eventName())}</span>`:"";
const opt=(on,attrs,label)=>`<button class="chip${on?' on':''}" ${attrs}>${esc(label)}</button>`;
function progress(){const order=["event","guide","style","known","path","where","wishes","result"],i=order.indexOf(S.step);bar.style.width=`${Math.max(0,i)/(order.length-1)*100}%`}
function nav(label="Далее",disabled=false,skip=""){footer.innerHTML=`<button class="next" id="next" ${disabled?'disabled':''}>${label}</button>${skip?`<button class="skip" id="skip">${skip}</button>`:''}`}
function go(step){S.step=step;render()}
function choice(items,selected,attr){return `<div class="choices">${items.map(x=>`<button class="choice wide ${selected===x[0]?'on':''}" ${attr}="${x[0]}"><b>${esc(x[1])}</b>${x[2]?`<small>${esc(x[2])}</small>`:''}</button>`).join('')}</div>`}
async function rpc(fn,body){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);try{const r=await fetch(API+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});if(!r.ok)throw new Error("Код "+r.status);return await r.json()}finally{clearTimeout(t)}}
function render(){progress();back.style.visibility=S.step==='event'?'hidden':'visible';window.scrollTo(0,0);({event,guide,style,known,path,browse,where,wishes,result})[S.step]()}
function event(){screen.innerHTML=`<p class="kicker">СВАДЕБНЫЙ БРИФ</p><h1>Что празднуем?</h1>${choice(EVENTS,S.event,'data-event')}`;nav('Далее',!S.event);screen.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{S.event=b.dataset.event;event()});footer.querySelector('#next').onclick=()=>S.event&&go('guide')}
function guide(){const i=S.g,[t,d]=GUIDE[i];screen.innerHTML=`${pill()}<div class="stepcount">Как организовать свадьбу · ${i+1} из ${GUIDE.length}</div><div class="need" style="min-height:220px;justify-content:center"><span class="pill acc" style="align-self:flex-start">Шаг ${i+1}</span><h1>${esc(t)}</h1><div style="font-size:17px">${esc(d)}</div></div><div class="dots">${GUIDE.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;nav(i<GUIDE.length-1?'Дальше':'Начать',false,'Пропустить');footer.querySelector('#next').onclick=()=>{if(S.g<GUIDE.length-1){S.g++;guide()}else go('style')};footer.querySelector('#skip').onclick=()=>go('style')}
function style(){screen.innerHTML=`${pill()}<h1>Какая у вас свадьба?</h1><p>Выберите, что ближе. Это подскажет нам площадки и исполнителей.</p>${choice(STYLES,S.style,'data-style')}`;nav('',false,'Пока не знаю');footer.querySelector('.next').style.display='none';screen.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{S.style=b.dataset.style;go('known')});footer.querySelector('#skip').onclick=()=>go('known')}
function known(){const ready=S.city&&S.guests;screen.innerHTML=`${pill()}<h1>Что вы уже знаете?</h1><p>Отметьте известное. Остальное уточним позже.</p><div class="fields"><div class="field"><label>Дата</label><input id="date" type="date" value="${esc(S.date)}"></div></div><div class="field" style="margin-top:18px"><label>Город</label><div class="chips">${CITIES.map(c=>opt(S.city===c,`data-city="${c}"`,c)).join('')}</div></div><div class="field" style="margin-top:18px"><label>Примерно гостей</label><div class="chips">${GUESTS.map(g=>opt(S.guests===g,`data-guests="${g}"`,`до ${g}`)).join('')}</div></div><div class="field" style="margin-top:18px"><label>Бюджет на всю свадьбу</label><div class="chips">${BUDGETS.map((b,i)=>opt(S.budget===i,`data-budget="${i}"`,b[0])).join('')}</div></div>`;nav('Дальше',!ready,ready?'':'Нужны хотя бы город и число гостей');screen.querySelector('#date').onchange=e=>S.date=e.target.value;screen.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{S.city=b.dataset.city;known()});screen.querySelectorAll('[data-guests]').forEach(b=>b.onclick=()=>{S.guests=+b.dataset.guests;known()});screen.querySelectorAll('[data-budget]').forEach(b=>b.onclick=()=>{S.budget=+b.dataset.budget;known()});footer.querySelector('#next').onclick=()=>ready&&go('path')}
function path(){const P=[["organizer","Доверю организатору","Подберём агентство, координатора или ведущего-продюсера. Вы выбираете — они делают."],["self","Организую сам","Пошаговый план, бюджет по статьям и проверенные исполнители на каждом шаге."],["browse","Пока смотрю","Реальные свадьбы, идеи и советы — без обязательств."]];screen.innerHTML=`${pill()}<h1>Как вам удобнее?</h1>${choice(P,S.path,'data-path')}<p style="margin-top:16px">Начать самому и потом передать всё организатору можно в любой момент — он получит уже собранный бриф.</p>`;footer.innerHTML='';screen.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{S.path=b.dataset.path;S.data=null;go(S.path==='self'?'where':S.path==='browse'?'browse':'result')})}
function browse(){screen.innerHTML=`${pill()}<h1>Вдохновение</h1><div class="need"><h2>Здесь будет витрина</h2><p>Реальные свадьбы с бюджетом и командой, свадьбы известных пар, тренды и гиды журнала. Наполняется после пилота базы.</p></div>`;nav('Начать планировать');footer.querySelector('#next').onclick=()=>{S.path='self';go('where')}}
function where(){screen.innerHTML=`${pill()}<h1>Где празднуем?</h1>${choice(WHERE,S.where,'data-where')}`;footer.innerHTML='';screen.querySelectorAll('[data-where]').forEach(b=>b.onclick=()=>{S.where=b.dataset.where;go('wishes')})}
function wishes(){const n=Object.values(S.wishes).filter(Boolean).length;screen.innerHTML=`${pill()}<h1>Что хотите на свадьбе?</h1><p>Отметьте всё, что нужно. Технику и кухню мы добавим сами, если понадобятся.</p><div class="chips">${WISHES.map(w=>opt(S.wishes[w[0]],`data-wish="${w[0]}"`,w[1])).join('')}</div>`;nav(`Собрать план · ${n+1} ${n?'пунктов':'пункт'}`);screen.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{S.wishes[b.dataset.wish]=!S.wishes[b.dataset.wish];wishes()});footer.querySelector('#next').onclick=()=>{S.data=null;go('result')}}
function plan(){const items=[],add=(code,why)=>{if(!items.find(x=>x.code===code))items.push({code,why})};if(S.path==='organizer'){add('organizer','ведёт всю подготовку');return items}if(S.where==='hall'||S.where==='unknown')add('venue','');if(S.where==='nokitchen'){add('venue','');add('catering','на площадке нет своей кухни')}if(S.where==='outdoor'){add('catering','праздник не в ресторане');add('tech','праздник не в ресторане — нужен звук и свет')}WISHES.forEach(w=>{if(S.wishes[w[0]])w[2].forEach(c=>add(c,''))});if((S.wishes.show||S.wishes.dj)&&S.where==='nokitchen')add('tech','живая музыка или DJ, а на площадке своего оборудования может не быть');return items}
function totalBudget(){const b=S.budget===null?null:BUDGETS[S.budget][1];if(b)return{sum:b,guess:false};const pg=S.style==='lux'?70000:S.style==='intimate'?45000:40000;return{sum:S.guests*pg,guess:true}}
function split(items){const{sum}=totalBudget(),w=items.reduce((a,x)=>a+(WEIGHT[x.code]||3),0),spend=sum*(1-RESERVE);items.forEach(x=>x.amount=spend*(WEIGHT[x.code]||3)/w);return{sum,reserve:sum*RESERVE}}
async function result(){footer.innerHTML='';if(!S.cfg){screen.innerHTML=`${pill()}<p>Собираю план…</p>`;try{S.cfg=await rpc('pub_brief_config',{p_type:'Свадьба'})||[]}catch(e){return fail(e)}}const items=plan(),info=split(items),tb=totalBudget(),cfg={};S.cfg.forEach(p=>cfg[p.code]=p);items.forEach(x=>{x.p=cfg[x.code]||{};x.max=x.p.unit==='per_guest'?x.amount/S.guests*1.15:x.amount*1.15});const summary=`<div class="sum"><span class="pill acc">${esc(eventName())}</span>${S.style?`<span class="pill">${esc(STYLES.find(s=>s[0]===S.style)[1])}</span>`:''}<span class="pill">${esc(S.city)}</span><span class="pill">до ${S.guests} гостей</span></div>`;const budget=`<div class="need"><div class="hd"><h2>Бюджет</h2><span class="pill ${tb.guess?'warn':'acc'}">${tb.guess?'оценка':'ваш'} ${mln(info.sum)}</span></div>${tb.guess?`<p class="small">Вы не указали бюджет. Обычно свадьба на ${S.guests} гостей в ${esc(S.city)} стоит около ${mln(info.sum)} — поправим, когда уточните.</p>`:''}<div class="gap">${items.map(x=>`<span>${esc(x.p.name||x.code)}${x.why?`<br><span class="muted small">${esc(x.why)}</span>`:''}</span><span>${mln(x.amount)}</span>`).join('')}<span class="muted">Непредвиденное</span><span class="muted">${mln(info.reserve)}</span></div></div>`;const paint=inner=>{screen.innerHTML=`${pill()}<h1>${S.path==='organizer'?'Организаторы для вашей свадьбы':'Ваш план и бюджет'}</h1>${summary}${inner}<button class="next" id="again" style="margin-top:18px">Начать заново</button>`;screen.querySelector('#again').onclick=()=>{reset();render()}};if(!S.data){paint((S.path==='organizer'?'':budget)+'<p style="margin-top:16px">Ищу исполнителей в базе…</p>');const req={city:S.city,guests:S.guests,needs:items.filter(x=>x.p.code).map(x=>({key:x.code,roles:x.p.roles,like:x.p.like,unit:x.p.unit,budget_max:Math.round(x.max)}))};try{S.data=await rpc('pub_brief_match',{a:req})||[]}catch(e){return fail(e)}if(S.step!=='result')return}const by={};S.data.forEach(d=>by[d.key]=d);const blocks=items.map(x=>{const d=by[x.code]||{rows:[],in_city:0};let body;if(!d.in_city)body=`<div class="note bad"><b>Пока никого.</b> В базе по городу ${esc(S.city)} таких исполнителей нет.</div>`;else if(!d.rows.length)body=`<div class="note"><b>В бюджет никто не попал.</b> Всего в городе ${num(d.in_city)} — можно увеличить сумму на эту статью.</div>`;else body=d.rows.slice(0,3).map(r=>`<div class="cand"><span class="nm">${esc(r.name)}</span><span class="pill ${r.verified?'ok':'warn'}">${r.verified?'проверено':'не проверено'}</span><span class="mt">${esc(r.price?`от ${num(r.price)} ₸ ${UNIT[r.price_unit]||UNIT[x.p.unit]||''}`:(r.price_note||'цена по запросу'))}</span></div>`).join('');return`<div class="need"><div class="hd"><h2>${esc(x.p.name||x.code)}</h2></div>${body}</div>`}).join('');const handoff=`<div class="need"><h2>Передать готовый бриф</h2><p>Организатор получит ваш план, бюджет и подборку.</p><button class="next" id="handoff">Передать организатору</button></div>`;paint((S.path==='organizer'?'':budget)+blocks+handoff);screen.querySelector('#handoff').onclick=()=>{S.path='organizer';S.data=null;go('result')}}
function fail(e){screen.innerHTML=`${pill()}<div class="err"><b>Не удалось получить данные</b><p>База не ответила. Попробуйте ещё раз.</p></div>`;nav('Попробовать снова');footer.querySelector('#next').onclick=()=>result()}
back.onclick=()=>{if(S.step==='guide'&&S.g>0){S.g--;guide();return}const prev={guide:'event',style:'guide',known:'style',path:'known',browse:'path',where:'path',wishes:'where',result:S.path==='organizer'?'path':'wishes'}[S.step];if(prev)go(prev)};
render();
</script></body></html>
